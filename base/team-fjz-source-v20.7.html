// ---------- Técnica de ejercicios ----------
function exerciseSourceV72(e){
  if(!e)return {};
  return exerciseLibrary.find(x=>x.id===e.libId)||exerciseLibrary.find(x=>normalizeExerciseTextV65?.(x.name)===normalizeExerciseTextV65?.(e.name))||e
}
function techniqueStepsV72(e){
  const src=exerciseSourceV72(e),name=normalizeExerciseTextV65?normalizeExerciseTextV65(src.name||e.name):String(src.name||e.name||'').toLowerCase();
  const muscle=normalizeExerciseTextV65?normalizeExerciseTextV65(src.muscle||e.muscle):String(src.muscle||e.muscle||'').toLowerCase();
  const cue=String(e.cue||src.cue||'').trim();
  let setup='Buscá una posición estable, ajustá el equipo a tu cuerpo y prepará el recorrido antes de cargar.';
  let execution=cue||'Mové la carga de forma controlada, manteniendo la posición durante toda la serie.';
  let key='Usá un rango cómodo y repetible; frená la serie si necesitás compensar o perder la postura.';

  if(/press|banca|fondos/.test(name)){
    setup='Apoyá bien pies y torso. Colocá hombros en una posición cómoda y mantené las escápulas estables antes de iniciar.';
    execution='Bajá la carga con control, mantené antebrazos alineados con el empuje y extendé sin perder la posición del hombro.';
    key='No rebotes abajo ni conviertas las últimas repeticiones en un movimiento desordenado. El recorrido debe ser consistente.';
  }else if(/remo/.test(name)){
    setup='Estabilizá el torso y acomodá el agarre para poder mover los codos sin encoger los hombros.';
    execution='Llevá los codos hacia atrás siguiendo la dirección del ejercicio, pausá brevemente y controlá el regreso.';
    key='Evitá balancear el tronco para terminar la repetición. Pensá en mover el brazo y la escápula, no en tirar con impulso.';
  }else if(/jalon|dominad|pullover/.test(name)){
    setup='Fijá el torso, dejá los hombros en una posición cómoda y prepará el agarre antes de iniciar la tracción.';
    execution='Llevá los codos hacia abajo o hacia el cuerpo según la variante y controlá la subida sin soltar la tensión.';
    key='Evitá convertir el ejercicio en un balanceo. Mantené el pecho y la pelvis estables durante todo el recorrido.';
  }else if(/elevacion lateral|pajaro|face pull|elevacion frontal/.test(name)){
    setup='Mantené el torso estable, hombros relajados y una leve flexión de codo cuando corresponda.';
    execution='Mové el brazo en un recorrido controlado, sin acelerar al inicio y sin dejar caer la carga en la vuelta.';
    key='No encogas los hombros ni uses impulso del cuerpo para subir más peso.';
  }else if(/curl/.test(name)&&!/femoral/.test(name)){
    setup='Fijá hombros y codos. Elegí un agarre cómodo y mantené las muñecas firmes.';
    execution='Flexioná el codo sin adelantar el hombro y controlá especialmente la fase de bajada.';
    key='Si necesitás balancearte para subir la carga, reducí el peso o terminá la serie.';
  }else if(/triceps|frances|extensi[oó]n.*polea|patada/.test(name)&&!muscle.includes('cuadr')){
    setup='Colocá el brazo en una posición estable y fijá el codo antes de iniciar.';
    execution='Extendé el codo de forma controlada y volvé sin dejar que hombro o torso hagan el trabajo.';
    key='Mantené el codo estable y evitá buscar rango extra moviendo la espalda o el hombro.';
  }else if(/sentadilla|hack|prensa|zancada|bulgar|step up|belt squat/.test(name)){
    setup='Apoyá toda la planta del pie, buscá una base estable y alineá rodillas con la dirección de los pies.';
    execution='Descendé con control hasta un rango que puedas mantener estable y empujá sin perder el apoyo del pie.';
    key='Evitá despegar pelvis o talones y no fuerces profundidad si la postura cambia claramente.';
  }else if(/rumano|peso muerto|buenos dias|pull through/.test(name)){
    setup='Mantené una leve flexión de rodillas, tronco firme y la carga cerca del cuerpo cuando corresponda.';
    execution='Llevá la cadera hacia atrás, mantené la columna estable y volvé extendiendo la cadera.';
    key='Buscá tensión en la cadena posterior sin redondear la espalda ni terminar hiperextendiendo la zona lumbar.';
  }else if(/femoral/.test(name)){
    setup='Ajustá la máquina para que la rodilla quede alineada con su eje y fijá la pelvis al apoyo.';
    execution='Flexioná la rodilla con control, pausá brevemente y regresá sin dejar caer la carga.';
    key='No levantes la cadera ni acortes el recorrido para mover más peso.';
  }else if(/cuadriceps|extensi[oó]n de cuadr/.test(name)){
    setup='Ajustá respaldo y rodillo para que la rodilla quede alineada con el eje de la máquina.';
    execution='Extendé la rodilla de forma controlada, pausá arriba y bajá sin soltar la carga.';
    key='Evitá rebotes y mantené la cadera apoyada durante toda la serie.';
  }else if(/hip thrust|puente|gluteo|abducci/.test(name)){
    setup='Buscá una posición estable de pelvis y tronco antes de iniciar el movimiento de cadera.';
    execution='Mové la cadera con control y terminá la repetición contrayendo glúteos sin exagerar el arco lumbar.';
    key='La parte final debe venir de la cadera, no de hiperextender la espalda.';
  }else if(/gemelo|pantorrilla/.test(name)){
    setup='Apoyá bien el antepié y dejá libre el talón para recorrer el movimiento del tobillo.';
    execution='Bajá controlado, buscá estiramiento y subí hasta una contracción clara con una pausa breve.';
    key='No rebotes ni conviertas el movimiento en pequeñas repeticiones rápidas.';
  }else if(/crunch|abdominal|plancha|pallof|hollow|dead bug|rueda|elevacion de piernas|elevacion de rodillas|woodchop/.test(name)||muscle.includes('core')||muscle.includes('abdominal')){
    setup='Organizá pelvis y caja torácica antes de moverte y mantené una respiración controlada.';
    execution='Realizá el movimiento sin impulso, buscando que el tronco mantenga el control durante todo el recorrido.';
    key='Si la zona lumbar pierde posición o necesitás balancearte, acortá el rango o simplificá la variante.';
  }else if(/muneca|antebrazo|farmer|pinza|dead hang|pronacion|supinacion|rodillo/.test(name)||muscle.includes('antebra')){
    setup='Fijá el antebrazo o el hombro según el ejercicio y prepará un agarre firme antes de comenzar.';
    execution='Mové la muñeca o sostené el agarre sin compensar con balanceos del brazo o del tronco.';
    key='Priorizá control y tiempo bajo tensión; el agarre no debería depender de movimientos bruscos.';
  }else if(cue){
    execution=cue+' Controlá también la fase de regreso para que cada repetición sea similar a la anterior.';
  }
  return {setup,execution,key}
}

async function loadExerciseFeedbackV73(force=false){
  const athleteId=currentAthleteIdV73();
  if(!athleteId){
    const local=student()?.exerciseFeedback||[];
    exerciseFeedbackCacheV73.set('local',local);
    return local
  }
  const key=feedbackKeyV73(athleteId);
  if(!force&&exerciseFeedbackCacheV73.has(key))return exerciseFeedbackCacheV73.get(key);
  const {data,error}=await supabaseClient.from('exercise_feedback')
    .select('*')
    .eq('athlete_id',athleteId)
    .order('created_at',{ascending:false})
    .limit(100);
  if(error)throw error;
  exerciseFeedbackCacheV73.set(key,data||[]);
  return data||[]
}
async function loadAllCoachFeedbackV73(force=false){
  if(currentProfile?.role!=='coach'||!supabaseClient)return [];
  if(exerciseFeedbackAllCoachV73.length&&!force)return exerciseFeedbackAllCoachV73;
  const {data,error}=await supabaseClient.from('exercise_feedback')
    .select('*')
    .eq('status','pending')
    .order('created_at',{ascending:false})
    .limit(200);

}

async function submitExerciseFeedbackV73(){
  const t=exerciseFeedbackTargetV73;if(!t)return;
  const type=document.querySelector('input[name="v73FeedbackType"]:checked')?.value||'comment';
  const message=el('v73FeedbackMessage')?.value.trim()||'';
  if(message.length<3){toast('Escribí un comentario breve');return}

  const athleteId=currentAthleteIdV73();
  if(cloudEnabled&&supabaseClient&&athleteId){
    const payload={
      athlete_id:athleteId,
      student_id:currentUser.id,
      exercise_uid:t.uid,
      exercise_name:t.name,
      workout_day_id:t.dayId||null,
      workout_day_name:t.dayName||null,
      feedback_type:type,
      message,
      status:'pending'
    };
    const {data,error}=await supabaseClient.from('exercise_feedback').insert(payload).select('*').single();
    if(error){toast(cloudErr(error));return}
    const key=feedbackKeyV73(athleteId),rows=exerciseFeedbackCacheV73.get(key)||[];

      id:uid('fb'),exercise_uid:t.uid,exercise_name:t.name,workout_day_id:t.dayId,
      workout_day_name:t.dayName,feedback_type:type,message,status:'pending',created_at:nowISO()
    });

    exerciseFeedbackCacheV73.set('local',s.exerciseFeedback)
  }

  closeModal();
  toast(type==='discomfort'?'Molestia enviada al coach':'Comentario enviado al coach');
  render()
}

async function signedExerciseVideoV80(path){
  if(!path)return '';
  const hit=exerciseMediaSignedV80.get(path);
  if(hit&&hit.expires>Date.now())return hit.url;
  const {data,error}=await supabaseClient.storage.from('exercise-videos').createSignedUrl(path,3600);
  if(error)return '';
  const url=data?.signedUrl||'';
  exerciseMediaSignedV80.set(path,{url,expires:Date.now()+50*60*1000});
  return url
}

}
function cssSafeV80(v){return String(v||'x').replace(/[^a-zA-Z0-9_-]/g,'_')}
async function hydrateExerciseVideosV80(force=false){
  const slots=[...document.querySelectorAll('.v80-video-slot[data-v80-video-key]')];
  if(!slots.length||!supabaseClient)return;
  try{
    await loadExerciseMediaV80(force);
    for(const slot of slots){
      const key=slot.dataset.v80VideoKey;
      await renderVideoSlotV80(slot,exerciseMediaCacheV80.get(key)||null)
    }
  }catch(e){
    slots.forEach(slot=>{
      if(!slot.querySelector('video'))slot.innerHTML='<div class="v80-video-empty"><div><strong>Video técnico</strong><p class="muted">No se pudo cargar en este momento.</p></div></div>'
    })
  }
}
async function uploadExerciseVideoV80(key,title,input){
  const file=input?.files?.[0];if(!file)return;
  if(currentProfile?.role!=='coach'){toast('Solo el coach puede subir videos');return}
  if(file.size>30*1024*1024){toast('El video debe pesar menos de 30 MB');input.value='';return}
  const ext=(file.name.split('.').pop()||'mp4').toLowerCase().replace(/[^a-z0-9]/g,'')||'mp4';
  const safe=cssSafeV80(key).slice(0,120);
  const path=`${currentUser.id}/${safe}/${Date.now()}.${ext}`;
  toast('Subiendo video…');
  const {error:upErr}=await supabaseClient.storage.from('exercise-videos').upload(path,file,{upsert:false,contentType:file.type||'video/mp4'});
  if(upErr){toast(cloudErr(upErr));return}
  const old=exerciseMediaCacheV80.get(key);
  const payload={coach_id:currentUser.id,exercise_key:key,title:`${title} · Técnica`,storage_path:path,video_url:null,is_active:true};
  const {data,error}=await supabaseClient.from('exercise_media').upsert(payload,{onConflict:'coach_id,exercise_key'}).select('*').single();
  if(error){toast(cloudErr(error));return}
  if(old?.storage_path&&old.storage_path!==path){try{await supabaseClient.storage.from('exercise-videos').remove([old.storage_path])}catch(e){}}
  exerciseMediaCacheV80.set(key,data);
  exerciseMediaSignedV80.clear();
  input.value='';
  toast('Video técnico guardado');
  hydrateExerciseVideosV80(true)
}
async function removeExerciseVideoV80(key){
  if(currentProfile?.role!=='coach')return;
  const row=exerciseMediaCacheV80.get(key);
  if(!row)return;
  const {error}=await supabaseClient.from('exercise_media').delete().eq('id',row.id);
  if(error){toast(cloudErr(error));return}
  if(row.storage_path){try{await supabaseClient.storage.from('exercise-videos').remove([row.storage_path])}catch(e){}}
  exerciseMediaCacheV80.delete(key);
  exerciseMediaSignedV80.clear();
  toast('Video eliminado');
  hydrateExerciseVideosV80(true)
}

const WEEK_NAMES_V81=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
let agendaScheduleV81=[];
let agendaRemindersV81=[];
let agendaLoadedV81=false;

function weekdayLocalV81(d=new Date()){return (d.getDay()+6)%7}
function startOfWeekV81(d=new Date()){
  const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-weekdayLocalV81(x));return x
}
function weekDatesV81(){
  const start=startOfWeekV81();
  return Array.from({length:7},(_,i)=>{const d=new Date(start);d.setDate(d.getDate()+i);return d})
}
function isoLocalV81(d){
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`
}
function fmtTimeV81(t){return t?String(t).slice(0,5):'Sin horario'}
function athleteByIdV81(id){return [...cloudAthletes.values()].find(a=>a.id===id)||null}
function scheduleForV81(athleteId){return agendaScheduleV81.filter(x=>x.athlete_id===athleteId&&x.active!==false)}
function remindersForV81(athleteId){return agendaRemindersV81.filter(x=>x.athlete_id===athleteId&&x.active!==false)}
function reminderDateV81(r,weekStart=startOfWeekV81()){
  if(r.schedule_type==='once')return r.reminder_date||null;
  const d=new Date(weekStart);d.setDate(d.getDate()+Number(r.weekday||0));return isoLocalV81(d)
}
function reminderOccursV81(r,date){
  const iso=isoLocalV81(date);
  if(r.schedule_type==='once')return r.reminder_date===iso;
  return Number(r.weekday)===weekdayLocalV81(date)
}
async function loadAgendaV81(force=false){
  if(!cloudEnabled||!supabaseClient)return {schedule:agendaScheduleV81,reminders:agendaRemindersV81};
  if(agendaLoadedV81&&!force)return {schedule:agendaScheduleV81,reminders:agendaRemindersV81};
  const [{data:schedule,error:se},{data:reminders,error:re}]=await Promise.all([
    supabaseClient.from('athlete_schedule').select('*').eq('active',true).order('weekday'),
    supabaseClient.from('athlete_reminders').select('*').eq('active',true).order('created_at',{ascending:false})
  ]);
  if(se)throw se;if(re)throw re;
  agendaScheduleV81=schedule||[];
  agendaRemindersV81=reminders||[];
  agendaLoadedV81=true;
  return {schedule:agendaScheduleV81,reminders:agendaRemindersV81}
}

async function saveStudentScheduleV81(){

  const jobs=[];
  for(let i=0;i<7;i++){
    const dayId=el(`v81Day_${i}`)?.value||'';
    if(!dayId){
      jobs.push(supabaseClient.from('athlete_schedule').delete().eq('athlete_id',ath.id).eq('weekday',i));
      continue
    }
    const d=s.days.find(x=>x.id===dayId);
    jobs.push(supabaseClient.from('athlete_schedule').upsert({
      athlete_id:ath.id,coach_id:currentUser.id,weekday:i,
      workout_day_id:dayId,workout_day_name:d?.name||'Entrenamiento',
      start_time:el(`v81Time_${i}`)?.value||null,
      reminder_enabled:el(`v81Rem_${i}`)?.value!=='0',
      reminder_minutes_before:60,active:true
    },{onConflict:'athlete_id,weekday'}))
  }
  const results=await Promise.all(jobs);
  const err=results.find(x=>x.error)?.error;
  if(err){toast(cloudErr(err));return}
  agendaLoadedV81=false;toast('Agenda semanal guardada');render()
}

function findRoutineIndexV81(s,row){
  let i=s.days.findIndex(d=>d.id===row.workout_day_id);
  if(i<0)i=s.days.findIndex(d=>normalizeTextV70(d.name)===normalizeTextV70(row.workout_day_name));
  return i
}
function completedTodayV81(s,row,date){
  const iso=isoLocalV81(date);
  return (s.sessions||[]).some(x=>{
    const xd=String(x.date||'').slice(0,10);
    const sameDay=xd===iso;
    const sameRoutine=!row.workout_day_name||normalizeTextV70(x.dayName||'')===normalizeTextV70(row.workout_day_name);
    return sameDay&&sameRoutine
  })
}
