.v80-attention-item.success{border-color:rgba(74,222,128,.22)}
.v80-attention-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.v80-attention-item h4{margin:0;font-size:12px}
.v80-attention-item p{margin:5px 0 0;line-height:1.45}
.v80-attention-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.v80-filter-row{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 12px}
.v80-filter-row .btn.active{background:rgba(255,31,47,.12);border-color:rgba(255,31,47,.38)}
.v80-student-cardline{display:flex;align-items:center;gap:9px;min-width:0}
.v80-student-alert-count{margin-left:auto}
.v80-360{border:1px solid rgba(255,31,47,.18);background:linear-gradient(135deg,rgba(255,31,47,.045),rgba(255,255,255,.01));}
.v80-360-head{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}
.v80-360-main{display:flex;align-items:center;gap:12px}
.v80-360-name h3{margin:0;font-size:18px}
.v80-360-name p{margin:4px 0 0}
.v80-360-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:13px}
.v80-360-metric{border:1px solid var(--border);border-radius:11px;padding:9px;background:#0e0e11}
.v80-360-metric strong{display:block;font-size:16px}
.v80-360-metric span{display:block;font-size:9px;color:var(--muted);margin-top:3px}
.v80-360-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.v80-video-slot{border:1px dashed #3a3a43;border-radius:13px;background:linear-gradient(180deg,rgba(255,255,255,.018),transparent);min-height:168px;overflow:hidden}
.v80-video-empty{min-height:168px;display:grid;place-items:center;text-align:center;padding:14px}
.v80-video-empty strong{display:block;font-size:12px}
.v80-video-empty p{margin:5px 0 0!important;font-size:10px!important;line-height:1.45}
.v80-video-player video{width:100%;display:block;max-height:220px;background:#000}
.v80-video-meta{padding:9px 10px;border-top:1px solid var(--border)}
.v80-video-meta strong{display:block;font-size:11px}
.v80-video-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.v80-video-upload{display:none}
.v80-system-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.v80-system-item{border:1px solid var(--border);border-radius:11px;padding:9px}
.v80-system-item strong{display:block;font-size:13px}
.v80-system-item span{display:block;color:var(--muted);font-size:9px;margin-top:3px}
@media(max-width:980px){
  .v80-dashboard-grid{grid-template-columns:1fr}
  .v80-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .v80-360-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:650px){
  .v80-kpis{grid-template-columns:1fr 1fr}
  .v80-360-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}

<style>
/* V8.1 · Agenda semanal + recordatorios + recuperación de acceso */
.v81-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.v81-day{border:1px solid var(--border);border-radius:13px;background:var(--card);padding:10px;min-width:0}
.v81-day.today{border-color:rgba(255,31,47,.48);background:rgba(255,31,47,.045)}
.v81-day-head{display:flex;justify-content:space-between;gap:6px;align-items:flex-start;margin-bottom:8px}
.v81-day-name{font-weight:900;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.v81-day-date{font-size:10px;color:var(--muted)}
.v81-day-title{font-weight:800;font-size:12px;line-height:1.35}
.v81-day-time{font-size:10px;color:var(--muted);margin-top:4px}
.v81-day-actions{margin-top:9px}
.v81-day-actions .btn{width:100%}
.v81-config-grid{display:grid;grid-template-columns:72px minmax(0,1.4fr) 120px 100px;gap:8px;align-items:end}
.v81-config-row{display:contents}
.v81-config-day{padding:10px 0;font-weight:900;font-size:11px}
.v81-reminders{display:grid;gap:8px}
.v81-reminder{border:1px solid var(--border);border-radius:12px;background:var(--card);padding:10px}
.v81-reminder-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.v81-reminder strong{font-size:12px}
.v81-reminder p{margin:5px 0 0;line-height:1.45}
.v81-today{border:1px solid rgba(255,31,47,.23);background:linear-gradient(135deg,rgba(255,31,47,.055),rgba(255,255,255,.01))}
.v81-today-list{display:grid;gap:8px;margin-top:10px}
.v81-today-item{border:1px solid var(--border);border-radius:11px;padding:9px 10px;background:#0d0d10;display:flex;justify-content:space-between;gap:10px;align-items:center}
.v81-coach-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.v81-coach-day{border:1px solid var(--border);border-radius:13px;padding:10px;min-height:160px}
.v81-coach-day.today{border-color:rgba(255,31,47,.48)}
.v81-coach-entry{border-top:1px solid var(--border);padding:7px 0;font-size:10px}
.v81-coach-entry:first-of-type{border-top:0}
.v81-coach-entry button{margin-top:5px}
.v81-auth-link{width:100%;margin-top:8px}
.v81-agenda-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-bottom:14px}
.v81-agenda-kpi{border:1px solid var(--border);border-radius:12px;padding:11px;background:var(--card)}
.v81-agenda-kpi strong{display:block;font-size:22px}
.v81-agenda-kpi span{display:block;color:var(--muted);font-size:10px;margin-top:4px}
@media(max-width:1050px){
  .v81-week,.v81-coach-week{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media(max-width:760px){
  .v81-week,.v81-coach-week{grid-template-columns:repeat(2,minmax(0,1fr))}
  .v81-config-grid{grid-template-columns:70px minmax(0,1fr)}
  .v81-config-grid .v81-time,.v81-config-grid .v81-remind{grid-column:2}
}
@media(max-width:470px){
  .v81-week,.v81-coach-week{grid-template-columns:1fr}
  .v81-agenda-kpis{grid-template-columns:1fr 1fr}
}
</style>

function clone(x){return JSON.parse(JSON.stringify(x))}
function loadState(){try{const v4=JSON.parse(localStorage.getItem('fjz_v4_state'));if(v4&&[4,5].includes(v4.version)){v4.version=5;return v4;}const v3=JSON.parse(localStorage.getItem('fjz_v3_state'));if(v3){v3.version=5;localStorage.setItem('fjz_v4_state',JSON.stringify(v3));return v3}const v2=JSON.parse(localStorage.getItem('fjz_v2_state'));if(v2){const x=migrateV2(v2);x.version=5;return x}return clone(initialState)}catch(e){return clone(initialState)}}
function migrateV2(v2){const st=clone(initialState);if(!v2.students?.length)return st;st.students=v2.students.map((s,si)=>({id:s.id||uid('s'),name:s.name||'Alumno',goal:s.goal||'Plan personalizado',coachMessage:'Respetá técnica, rango de repeticiones y RIR.',checkin:s.checkin||'Pendiente',plannedPerWeek:Math.max(1,s.days?.length||3),lastWorkout:s.last==='Hoy'?nowISO():daysAgo(3),days:(s.days||[]).map((d,di)=>({id:uid('d'),name:d.name||`Día ${di+1}`,muscles:d.muscles||'General',exercises:(d.exercises||[]).map(e=>({uid:uid('e'),libId:e.id||'',name:e.name,muscle:e.muscle||'',equipment:e.equipment||'',sets:e.sets||3,min:e.min||8,max:e.max||12,rirMin:e.rirMin??1,rirMax:e.rirMax??2,rest:e.rest||120,cue:e.cue||'',increment:e.increment||2.5,override:null,history:(e.previous?.length?[{date:daysAgo(7),sets:e.previous,target:`${e.sets||3}|${e.min||8}|${e.max||12}|${e.rirMin??1}|${e.rirMax??2}`}]:[])}))})),sessions:(v2.history?.[s.id]||[]).map(h=>({id:uid('ss'),date:h.date||daysAgo(2),dayId:'',dayName:h.day||'Entrenamiento',summary:{up:h.up||0,hold:h.hold||0,review:h.review||0,totalSets:h.totalSets||0},exerciseResults:[]})),checkins:[]}));st.selectedStudentId=v2.selectedStudentId||st.students[0].id;saveState(st);return st}
function saveState(custom){const v=custom||state;v.version=5;localStorage.setItem('fjz_v4_state',JSON.stringify(v));if(window.__fjzCloudReady&&!window.__fjzCloudApplying)scheduleCloudSync()}
function el(id){return document.getElementById(id)}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function toast(msg){const t=el('toast');t.textContent=msg;t.style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.style.display='none',1900)}
function student(){return state.students.find(s=>s.id===state.selectedStudentId)||state.students[0]}
function fmtDate(iso){if(!iso)return'Sin registros';const d=new Date(iso);return d.toLocaleDateString('es-AR',{day:'2-digit',month:'short'})}
function daysSince(iso){if(!iso)return 999;return Math.floor((Date.now()-new Date(iso).getTime())/86400000)}
function allExercises(s=student()){return s.days.flatMap((d,di)=>d.exercises.map((e,ei)=>({e,d,di,ei})))}
function targetSig(e){return `${e.sets}|${e.min}|${e.max}|${e.rirMin}|${e.rirMax}`}
function latestHistory(e){return e.history?.length?e.history[e.history.length-1]:null}
function adherence(s){const since=Date.now()-7*86400000;const done=(s.sessions||[]).filter(x=>new Date(x.date).getTime()>=since).length;return Math.min(100,Math.round(done/Math.max(1,s.plannedPerWeek||s.days.length||1)*100))}
function recentResults(s){return (s.sessions||[]).slice(-3).flatMap(x=>x.exerciseResults||[])}
function statusFor(s){const rs=recentResults(s);const rev=rs.filter(x=>x.recommendation?.type==='down'||x.recommendation?.type==='plateau').length;const prog=rs.filter(x=>['up','rep','load'].includes(x.recommendation?.type)).length;if(rev>=2||daysSince(s.lastWorkout)>=6)return'Revisar';if(prog>=2)return'Progresando';return'Estable'}
function badge(status){const c=status==='Progresando'?'green':status==='Estable'?'amber':'red';return `<span class="badge ${c}">● ${status}</span>`}
function populatePicker(){const p=el('studentPicker');p.innerHTML=state.students.map(s=>`<option value="${s.id}" ${s.id===state.selectedStudentId?'selected':''}>${esc(s.name)}</option>`).join('');p.onchange=e=>{state.selectedStudentId=e.target.value;saveState();coachStudentTab='summary';studentTab='home';render()}}
function render(){populatePicker();el('coachMode').classList.toggle('active',mode==='coach');el('studentMode').classList.toggle('active',mode==='student');el('coachMode').onclick=()=>{mode='coach';render()};el('studentMode').onclick=()=>{mode='student';render()};if(mode==='coach')renderCoach();else renderStudent();renderBottomNav()}

function coachAlerts(){return state.students.flatMap(s=>{const arr=[];const st=statusFor(s);if(st==='Revisar')arr.push({s,type:'review',text:daysSince(s.lastWorkout)>=6?`Hace ${daysSince(s.lastWorkout)} días que no registra entrenamiento.`:'Tiene ejercicios que requieren revisión.'});if((s.checkin||'Pendiente')==='Pendiente')arr.push({s,type:'checkin',text:'Check-in semanal pendiente.'});return arr}).slice(0,6)}
function renderCoach(){if(coachTab==='student')return renderCoachStudent();const v=el('view'),avg=Math.round(state.students.reduce((a,s)=>a+adherence(s),0)/Math.max(1,state.students.length)),alerts=coachAlerts();v.innerHTML=`<section class="hero"><div><h2>Panel Coach</h2><p>Una vista rápida para detectar quién progresa, quién necesita revisión y qué tareas tenés pendientes.</p></div><div class="pill-row"><button class="btn" onclick="showTemplates()">Plantillas</button><button class="btn primary" onclick="newStudent()">+ Nuevo alumno</button></div></section>

function studentRows(arr){return arr.map(s=>`<div class="student-row"><div class="student-main"><div class="avatar">${esc(s.name.slice(0,2).toUpperCase())}</div><div><strong>${esc(s.name)}</strong><div class="muted tiny">${esc(s.goal)}</div></div></div><div><strong>${adherence(s)}%</strong><div class="muted tiny">Adherencia</div></div><div><strong>${fmtDate(s.lastWorkout)}</strong><div class="muted tiny">Último entreno</div></div><div>${badge(statusFor(s))}</div><button class="btn small" onclick="openStudent('${s.id}')">Abrir</button></div>`).join('')}

function renderCoachSummary(){const s=student(),b=el('coachStudentBody'),all=allExercises(s),overrides=all.filter(x=>x.e.override).length,rs=recentResults(s),review=rs.filter(x=>['down','plateau'].includes(x.recommendation?.type)).length;b.innerHTML=`<div class="grid kpi"><div class="card"><strong>${s.days.length}</strong><span>Días programados</span></div><div class="card"><strong>${all.length}</strong><span>Ejercicios activos</span></div><div class="card"><strong>${s.sessions.length}</strong><span>Sesiones guardadas</span></div><div class="card"><strong>${review}</strong><span>Revisiones recientes</span></div></div><div class="grid two"><div class="card"><div class="section-title"><h3>Mensaje para el alumno</h3><button class="btn small" onclick="editCoachMessage()">Editar</button></div><div class="coach-note">${esc(s.coachMessage||'Sin mensaje cargado.')}</div><div class="section-title" style="margin-top:18px"><h3>Resumen de seguimiento</h3></div><div class="metric-grid"><div class="metric"><strong>${adherence(s)}%</strong><span class="muted tiny">Adherencia 7 días</span></div><div class="metric"><strong>${fmtDate(s.lastWorkout)}</strong><span class="muted tiny">Último entrenamiento</span></div><div class="metric"><strong>${overrides}</strong><span class="muted tiny">Indicaciones manuales</span></div><div class="metric"><strong>${s.checkin||'Pendiente'}</strong><span class="muted tiny">Check-in</span></div></div></div><aside class="card"><h3 style="margin-top:0">Acciones rápidas</h3><div class="grid"><button class="btn primary" onclick="coachStudentTab='routine';render()">Editar rutina</button><button class="btn" onclick="coachStudentTab='progress';render()">Revisar progresión</button><button class="btn" onclick="showTemplates()">Aplicar plantilla</button><button class="btn" onclick="markCheckin()">Marcar check-in recibido</button></div><div class="inline-note" style="margin-top:14px"><span>⚙</span><div class="tiny muted">Las recomendaciones automáticas se pueden function saveExercise(di,ei,exUid,libId,muscle,equipment){const old=ei==null?null:student().days[di].exercises[ei];const data={uid:old?.uid||exUid||uid('e'),libId,name:el('fName').value.trim()||'Ejercicio',muscle,equipment,sets:+el('fSets').value,min:+el('fMin').value,max:+el('fMax').value,rirMin:+el('fRMin').value,rirMax:+el('fRMax').value,rest:+el('fRest').value,cue:el('fCue').value.trim(),increment:+el('fInc').value,history:old?.history||[],override:old?.override||null};if(ei==null)student().days[di].exercises.push(data);else student().days[di].exercises[ei]=data;saveState();closeModal();render();toast('Rutina actualizada')}

function newStudent(){showModal(`<div class="modal-head"><h3>Nuevo alumno</h3><button class="btn small" onclick="closeModal()">✕</button></div><label class="tiny muted">Nombre<input id="nName" class="input"></label><label class="tiny muted" style="display:block;margin-top:10px">Objetivo<input id="nGoal" class="input" placeholder="Hipertrofia, recomposición..."></label><label class="tiny muted" style="display:block;margin-top:10px">Entrenamientos por semana<input id="nFreq" class="input" type="number" min="1" max="7" value="4"></label><button class="btn primary" style="width:100%;margin-top:14px" onclick="createStudent()">Crear alumno</button>`)}

function renderStudent(){if(studentTab==='workout')return renderWorkout();if(studentTab==='tracking')return renderStudentShell('Check-in y seguimiento',()=>renderTrackingStudent());if(studentTab==='progress')return renderStudentShell('Progreso',()=>renderProgress(false));if(studentTab==='history')return renderStudentShell('Historial',()=>renderHistory(false));const s=student(),v=el('view');v.innerHTML=`<section class="hero"><div><h2>Hola, ${esc(s.name)}</h2><p>Tu rutina, tus registros y las indicaciones del coach están conectados en el mismo lugar.</p></div>${badge(statusFor(s))}</section><div class="grid kpi"><div class="card"><strong>${adherence(s)}%</strong><span>Adherencia 7 días</span></div><div class="card"><strong>${s.days.length}</strong><span>Días programados</span></div><div class="card"><strong>${s.sessions.length}</strong><span>Entrenamientos guardados</span></div><div class="card"><strong>${statusFor(s)}</strong><span>Estado</span></div></div><div class="grid two"><div class="card"><div class="section-title"><h3>Tu entrenamiento</h3><span class="badge blue">Rutina del coach</span></div>${s.days.map((d,i)=>`<div class="exercise-row"><div><h4>${esc(d.name)}</h4><p>${esc(d.muscles)} · ${d.exercises.length} ejercicios</p></div><button class="btn primary small" onclick="startWorkout(${i})">Entrenar</button></div>`).join('')}</div><aside class="card"><h3 style="margin-top:0">Mensaje del coach</h3><div class="coach-note">${esc(s.coachMessage||'Sin mensaje nuevo.')}</div><button class="btn primary" style="width:100%;margin-top:14px" onclick="studentTab='tracking';render()">Completar check-in semanal</button><h3 style="margin-top:18px">Últimas sesiones</h3>${s.sessions.length?s.sessions.slice(-3).reverse().map(x=>`<div class="history-item"><div><strong>${esc(x.dayName)}</strong><div class="muted tiny">${fmtDate(x.date)} · ${x.summary?.totalSets||0} series</div></div><span class="badge ${x.summary?.review?'red':'green'}">${x.summary?.review?'Revisar':'OK'}</span></div>`).join(''):'<div class="empty">Todavía no hay sesiones.</div>'}</aside></div>`}
function renderStudentShell(title,cb){const v=el('view');v.innerHTML=`<section class="hero"><div><button class="btn ghost small" onclick="studentTab='home';render()">← Inicio</button><h2 style="margin-top:10px">${title}</h2><p>${esc(student().name)}</p></div></section><div id="studentSubBody"></div>`;cb('studentSubBody')}
function startWorkout(i){currentDay=i;workoutDraft={};studentTab='workout';render()}
function renderWorkout(){const s=student(),d=s.days[currentDay],v=el('view');v.innerHTML=`<section class="hero"><div><button class="btn ghost small" onclick="studentTab='home';render()">← Inicio</button><h2 style="margin-top:10px">${esc(d.name)}</h2><p>${esc(d.muscles)} · ${d.exercises.length} ejercicios</p></div><button class="btn primary" onclick="finishWorkout()">Finalizar sesión</button></section><div class="session-progress"><span style="width:${d.exercises.length?Math.round(Object.keys(workoutDraft).length/d.exercises.length*100):0}%"></span></div><div style="height:14px"></div>${d.exercises.length?d.exercises.map((e,i)=>workoutExercise(e,i)).join(''):`<div class="empty">Tu coach todavía no cargó ejercicios en este día.</div>`}`}
function baselineSets(e){const last=latestHistory(e);return last?.sets||[]}
function workoutExercise(e,i){const prev=baselineSets(e);const rec=currentRecommendation(e);return `<div class="card session-card"><div class="day-head"><div><strong>${i+1}. ${esc(e.name)}</strong><div class="muted tiny">${e.sets} series · ${e.min}–${e.max} reps · RIR ${e.rirMin}–${e.rirMax} · descanso ${e.rest}s</div></div><span class="badge amber">Objetivo</span></div><p class="muted tiny">${esc(e.cue||'')}</p>${prev.length?`<div class="coach-note tiny"><strong>Última sesión:</strong> ${prev.map((x,j)=>`S${j+1} ${x[0]}kg × ${x[1]} · RIR ${x[2]}`).join(' · ')}</div>`:'<div class="coach-note tiny"><strong>Primera sesión:</strong> esta carga va a crear tu referencia inicial.</div>'}<div style="height:10px"></div>${Array.from({length:e.sets},(_,si)=>{const p=prev[si]||prev[prev.length-1]||[0,e.min,e.rirMax];const draft=(workoutDraft[e.uid]||[])[si];const vals=draft||p;return `<div class="set-grid"><div class="set-n">${si+1}</div><label class="tiny muted">Kg<input class="input" type="number" step="0.5" value="${vals[0]||''}" oninput="setWorkout('${e.uid}',${si},0,this.value)"></label><label class="tiny muted">Reps<input class="input" type="number" value="${vals[1]||e.min}" oninput="setWorkout('${e.uid}',${si},1,this.value)"></label><label class="tiny muted">RIR<input class="input" type="number" min="0" max="10" value="${vals[2]??e.rirMax}" oninput="setWorkout('${e.uid}',${si},2,this.value)"></label></div>`}).join('')}<div id="rec_${e.uid}">${recommendationHtml(e,rec)}</div></div>`}
function ensureDraft(e){if(!workoutDraft[e.uid]){const prev=baselineSets(e);workoutDraft[e.uid]=Array.from({length:e.sets},(_,i)=>[...(prev[i]||prev[prev.length-1]||[0,e.min,e.rirMax])])}return workoutDraft[e.uid]}
function setWorkout(uidv,si,field,val){const e=allExercises().find(x=>x.e.uid===uidv)?.e;if(!e)return;ensureDraft(e)[si][field]=+val;const holder=el('rec_'+uidv);if(holder)holder.innerHTML=recommendationHtml(e,currentRecommendation(e))}
function currentSets(e){return workoutDraft[e.uid]||Array.from({length:e.sets},(_,i)=>{const prev=baselineSets(e);return [...(prev[i]||prev[prev.length-1]||[0,e.min,e.rirMax])]})}
function autoRecommendation(e,sets){const valid=sets.length===e.sets&&sets.every(x=>x[0]>0&&x[1]>0&&x[2]>=0);if(!valid)return{type:'none',title:'Completá todas las series',copy:'Necesito carga, repeticiones y RIR válidos para analizar la sesión.'};const hist=e.history||[],last=latestHistory(e),sig=targetSig(e);if(last&&last.target&&last.target!==sig)return{type:'reset',title:'Nueva referencia',copy:'Cambió el objetivo de este ejercicio. Esta sesión servirá como nueva base de comparación.'};const allTop=sets.every(x=>x[1]>=e.max&&x[2]>=e.rirMin&&x[2]<=e.rirMax);const tooHard=sets.filter(x=>x[1]<e.min||x[2]<e.rirMin).length>=Math.ceil(e.sets/2);const sameWeight=sets.every(x=>Math.abs(x[0]-sets[0][0])<.001);if(!last)return{type:'first',title:'Primera referencia',copy:'Guardá esta sesión. La próxima vez ya podremos comparar y recomendar progresión.'};if(allTop&&sameWeight)return{type:'up',title:`Próxima sesión: probá ${round1(sets[0][0]+(e.increment||2.5))} kg`,copy:'Completaste el techo del rango manteniendo el RIR objetivo.'};if(tooHard)return{type:'down',title:'Mantené o bajá levemente la carga',copy:'Varias series quedaron fuera del rango o demasiado cerca del fallo. Recuperá reps y RIR antes de subir.'};const prev=last.sets||[],sameLoad=prev.length===sets.length&&sets.every((x,i)=>Math.abs(x[0]-(prev[i]?.[0]||0))<.001),reps=sets.reduce((a,x)=>a+x[1],0),prevReps=prev.reduce((a,x)=>a+(x[1]||0),0),vol=sets.reduce((a,x)=>a+x[0]*x[1],0),prevVol=prev.reduce((a,x)=>a+x[0]*x[1],0);if(sameLoad&&reps>prevReps)return{type:'rep',title:'Mantené la carga y sumá reps',copy:`Mejoraste ${reps-prevReps} rep${reps-prevReps===1?'':'s'} totales. Acercate al techo del rango antes de subir peso.`};if(vol>prevVol*1.04&&sets.every(x=>x[1]>=e.min&&x[2]>=e.rirMin))return{type:'load',title:'Carga más alta bien tolerada',copy:'El volumen subió y seguís dentro del objetivo. Consolidá esta carga antes del próximo salto.'};if(hist.length>=3){const last3=hist.slice(-3).map(h=>h.sets.reduce((a,x)=>a+x[0]*x[1],0));const spread=Math.max(...last3)-Math.min(...last3);if(spread/Math.max(1,last3[0])<.025)return{type:'plateau',title:'Revisar progresión',copy:'Llevás varias sesiones prácticamente iguales. Puede convenir ajustar reps, carga, descanso o ejecución.'}}return{type:'hold',title:'Mantené la carga',copy:'Consolidá técnica, repeticiones y RIR antes del próximo incremento.'}}
function currentRecommendation(e){const auto=autoRecommendation(e,currentSets(e));if(e.override?.active)return{type:'override',title:e.override.title||'Indicación del coach',copy:e.override.note||'Seguí la indicación manual del coach.',auto};return auto}
function recommendationHtml(e,r){if(r.type==='override')return `<div class="recommend coach"><strong>${esc(r.title)}</strong><div class="muted tiny" style="margin-top:4px">${esc(r.copy)}</div><div class="micro muted" style="margin-top:7px">Automático: ${esc(r.auto.title)}</div></div>`;return `<div class="recommend"><strong>${esc(r.title)}</strong><div class="muted tiny" style="margin-top:4px">${esc(r.copy)}</div></div>`}
function round1(n){return Math.round(n*10)/10}
function finishWorkout(){const s=student(),d=s.days[currentDay];if(!d.exercises.length){studentTab='home';render();return}for(const e of d.exercises){const sets=currentSets(e);if(sets.some(x=>!x[0]||!x[1])){toast('Completá todas las series antes de finalizar');return}}let up=0,hold=0,review=0,totalSets=0;const exerciseResults=[];d.exercises.forEach(e=>{const sets=currentSets(e).map(x=>[+x[0],+x[1],+x[2]]),r=currentRecommendation(e),baseType=r.type==='override'?(r.auto?.type||'hold'):r.type;if(['up','rep','load'].includes(baseType))up++;else if(['down','plateau'].includes(baseType))review++;else hold++;totalSets+=sets.length;e.history=e.history||[];e.history.push({date:nowISO(),sets,target:targetSig(e),recommendation:clone(r)});exerciseResults.push({exerciseUid:e.uid,name:e.name,sets,recommendation:clone(r)});});const session={id:uid('ss'),date:nowISO(),dayId:d.id,dayName:d.name,summary:{up,hold,review,totalSets},exerciseResults};s.sessions=s.sessions||[];s.sessions.push(session);s.lastWorkout=session.date;saveState();showModal(`<div class="modal-head"><h3>Entrenamiento completado</h3><button class="btn small" onclick="closeModal();studentTab='home';render()">✕</button></div><div class="grid summary-grid"><div class="card"><strong class="stat-good" style="font-size:28px">${up}</strong><div class="muted tiny">Progresaron</div></div><div class="card"><strong class="stat-warn" style="font-size:28px">${hold}</strong><div class="muted tiny">Se mantuvieron</div></div><div class="card"><strong class="stat-bad" style="font-size:28px">${review}</strong><div class="muted tiny">Revisar</div></div></div><p class="muted">Se guardaron ${totalSets} series. El coach ya puede ver esta sesión desde su panel.</p><button class="btn primary" style="width:100%" onclick="closeModal();studentTab='home';render()">Volver al inicio</button>`)}

function renderProgress(isCoach,targetId){const s=student(),target=targetId|| (isCoach?'coachStudentBody':'studentSubBody'),b=el(target),items=allExercises(s).filter(x=>x.e.history?.length);if(!items.length){b.innerHTML='<div class="empty">Todavía no hay historial suficiente para mostrar progreso.</div>';return}if(!selectedProgressExercise||!items.some(x=>x.e.uid===selectedProgressExercise))selectedProgressExercise=items[0].e.uid;const ex=items.find(x=>x.e.uid===selectedProgressExercise).e,h=ex.history||[],latest=h[h.length-1],first=h[0],latestLoad=Math.max(...latest.sets.map(x=>x[0])),firstLoad=Math.max(...first.sets.map(x=>x[0])),latestVol=latest.sets.reduce((a,x)=>a+x[0]*x[1],0),firstVol=first.sets.reduce((a,x)=>a+x[0]*x[1],0);b.innerHTML=`<div class="grid two"><div class="card"><div class="section-title"><h3>Progreso por ejercicio</h3><select id="progressExercise" class="input" style="max-width:310px">${items.map(x=>`<option value="${x.e.uid}" ${x.e.uid===ex.uid?'selected':''}>${esc(x.e.name)}</option>`).join('')}</select></div><div class="segmented" style="width:max-content;margin-bottom:12px"><button class="${progressMetric==='load'?'active':''}" onclick="progressMetric='load';render()">Carga</button><button class="${progressMetric==='volume'?'active':''}" onclick="progressMetric='volume';render()">Volumen</button><button class="${progressMetric==='reps'?'active':''}" onclick="progressMetric='reps';render()">Reps</button></div>${progressChart(ex,progressMetric)}<div class="metric-grid" style="margin-top:12px"><div class="metric"><strong>${latestLoad} kg</strong><span class="muted tiny">Carga máxima</span></div><div class="metric"><strong>${latestVol.toLocaleString('es-AR')}</strong><span class="muted tiny">Volumen última sesión</span></div><div class="metric"><strong>${h.length}</strong><span class="muted tiny">Sesiones del ejercicio</span></div><div class="metric"><strong>${round1(latestLoad-firstLoad)} kg</strong><span class="muted tiny">Cambio desde inicio</span></div></div></div><aside class="card"><h3 style="margin-top:0">Recomendación actual</h3>${recommendationHtml(ex,autoRecommendation(ex,latest.sets))}${isCoach?`<button class="btn primary" style="width:100%;margin-top:12px" onclick="setCoachOverride('${ex.uid}')">${ex.override?.active?'Editar indicación':'Sobrescribir recomendación'}</button>${ex.override?.active?`<button class="btn" style="width:100%;margin-top:8px" onclick="clearCoachOverride('${ex.uid}')">Quitar indicación manual</button>`:''}`:''}<hr style="border:0;border-top:1px solid var(--border);margin:16px 0"><h4>Últimas sesiones</h4>${h.slice(-4).reverse().map(x=>`<div class="history-item"><div><strong>${fmtDate(x.date)}</strong><div class="muted tiny">${x.sets.map(s=>`${s[0]}×${s[1]}`).join(' · ')}</div></div><span class="badge amber">RIR ${round1(x.sets.reduce((a,s)=>a+s[2],0)/x.sets.length)}</span></div>`).join('')}</aside></div>`;el('progressExercise').onchange=e=>{selectedProgressExercise=e.target.value;render()}}
function progressChart(e,metric){const h=e.history||[],vals=h.map(x=>{if(metric==='volume')return x.sets.reduce((a,s)=>a+s[0]*s[1],0);if(metric==='reps')return x.sets.reduce((a,s)=>a+s[1],0);return Math.max(...x.sets.map(s=>s[0]))});const w=700,hg=220,p=30,min=Math.min(...vals),max=Math.max(...vals),span=Math.max(1,max-min),pts=vals.map((v,i)=>({x:p+(vals.length===1?(w-2*p)/2:i*(w-2*p)/(vals.length-1)),y:hg-p-(v-min)/span*(hg-2*p),v}));return `<div class="chart-wrap"><svg viewBox="0 0 ${w} ${hg}" preserveAspectRatio="none"><line x1="${p}" y1="${hg-p}" x2="${w-p}" y2="${hg-p}" class="chart-axis"/><line x1="${p}" y1="${p}" x2="${p}" y2="${hg-p}" class="chart-axis"/><polyline class="chart-line" points="${pts.map(q=>q.x+','+q.y).join(' ')}"/>${pts.map((q,i)=>`<circle class="chart-point" cx="${q.x}" cy="${q.y}" r="4"/><text class="chart-text" x="${q.x}" y="${Math.max(12,q.y-9)}" text-anchor="middle">${Math.round(q.v*10)/10}</text><text class="chart-text" x="${q.x}" y="${hg-7}" text-anchor="middle">${i+1}</text>`).join('')}</svg><div class="muted micro">Eje X: sesiones registradas · Métrica: ${metric==='load'?'carga máxima (kg)':metric==='volume'?'volumen total (kg)':'repeticiones totales'}</div></div>`}
function setCoachOverride(uidv){const ex=allExercises().find(x=>x.e.uid===uidv)?.e;if(!ex)return;showModal(`<div class="modal-head"><h3>Indicación manual</h3><button class="btn small" onclick="closeModal()">✕</button></div><label class="tiny muted">Título<select id="ovTitle" class="input"><option ${ex.override?.title==='Mantené la carga'?'selected':''}>Mantené la carga</option><option ${ex.override?.title==='Subí la carga'?'selected':''}>Subí la carga</option><option ${ex.override?.title==='Bajá la carga'?'selected':''}>Bajá la carga</option><option ${ex.override?.title==='Priorizá técnica'?'selected':''}>Priorizá técnica</option></select></label><label class="tiny muted" style="display:block;margin-top:10px">Mensaje<textarea id="ovNote" class="input" rows="4">${esc(ex.override?.note||'')}</textarea></label><button class="btn primary" style="width:100%;margin-top:12px" onclick="saveCoachOverride('${uidv}')">Guardar indicación</button>`)}
function saveCoachOverride(uidv){const ex=allExercises().find(x=>x.e.uid===uidv)?.e;ex.override={active:true,title:el('ovTitle').value,note:el('ovNote').value.trim()};saveState();closeModal();render();toast('Indicación del coach guardada')}

function comparisonMonthsV53(){const set=new Set();trackingCache.checkins.forEach(x=>{const k=monthKeyFromDate(x.week_start);if(k)set.add(k)});trackingCache.measurements.forEach(x=>{const k=monthKeyFromDate(x.measured_on);if(k)set.add(k)});trackingCache.photos.forEach(x=>{const k=monthKeyFromDate(x.taken_on);if(k)set.add(k)});(student()?.sessions||[]).forEach(x=>{const k=monthKeyFromDate(x.date);if(k)set.add(k)});return [...set].sort()}

function monthlyAutomaticSummaryV53(a,b){const bits=[];const ma=a.measurement||{},mb=b.measurement||{};const add=(label,x,y,unit)=>{x=Number(x);y=Number(y);if(Number.isFinite(x)&&Number.isFinite(y)&&Math.abs(y-x)>=.05)bits.push(`${label}: ${y-x>0?'+':''}${(y-x).toFixed(1)}${unit}`)};add('Peso',ma.weight_kg,mb.weight_kg,' kg');add('Cintura',ma.waist_cm,mb.waist_cm,' cm');add('Abdomen',ma.abdomen_cm,mb.abdomen_cm,' cm');const adA=a.wellness.adherence,adB=b.wellness.adherence;if(Number.isFinite(adA)&&Number.isFinite(adB))bits.push(`Adherencia media: ${adA.toFixed(1)} → ${adB.toFixed(1)}/10`);bits.push(`Entrenamientos registrados: ${a.training.sessions} → ${b.training.sessions}`);return bits.join(' · ')}

async function comparisonPhotoCellV53(photo,month){if(!photo)return`<div class="compare-photo"><div class="compare-photo-empty">Sin foto<br>${esc(monthTitleV53(month))}</div><div class="compare-photo-meta"><span class="muted tiny">Pendiente</span></div></div>`;const url=await signedPhotoUrl(photo.storage_path);return`<div class="compare-photo">${url?`<img src="${url}" alt="Foto de progreso">`:'<div class="compare-photo-empty">No se pudo cargar la foto</div>'}<div class="compare-photo-meta"><strong>${esc(monthTitleV53(month))}</strong><div class="muted tiny">${formatTrackingDate(photo.taken_on)}</div></div></div>`}
function injectMonthlyComparisonV53(){const host=el('coachStudentBody');if(!host||el('monthlyCompareCard'))return;const card=document.createElement('div');card.id='monthlyCompareCard';card.className='card compare-shell';card.innerHTML=`<div class="section-title"><div><h3>Comparar progreso</h3><div class="muted tiny">Chequeo mensual lado a lado: fotos, medidas, bienestar y rendimiento.</div></div><span class="badge blue">Mensual</span></div><div id="monthlyCompareInner"><div class="empty">Preparando comparador…</div></div>`;host.appendChild(card);setupMonthlyComparisonV53()}
function setupMonthlyComparisonV53(){const b=el('monthlyCompareInner');if(!b)return;const months=comparisonMonthsV53();if(months.length<2){b.innerHTML=`<div class="compare-empty"><strong>Comparador listo</strong><div style="margin-top:6px">Cuando este alumno tenga registros en al menos dos meses, vas a poder enfrentarlos acá.</div><div class="muted tiny" style="margin-top:8px">Ahora hay datos en ${months.length||0} mes${months.length===1?'':'es'}.</div></div>`;return}const newest=months[months.length-1],previous=months[months.length-2];const opts=months.map(m=>`<option value="${m}">${esc(monthTitleV53(m))}</option>`).join('');b.innerHTML=`<div class="compare-controls"><label class="tiny muted">Mes inicial<select id="compareMonthA">${opts}</select></label><button class="btn small compare-swap" onclick="swapComparisonMonthsV53()">⇄ Intercambiar</button><label class="tiny muted">Mes final<select id="compareMonthB">${opts}</select></label><button class="btn primary compare-go" onclick="renderMonthlyComparisonV53()">Comparar</button></div><div id="monthlyCompareResult"></div>`;el('compareMonthA').value=previous;el('compareMonthB').value=newest;renderMonthlyComparisonV53()}
function swapComparisonMonthsV53(){const a=el('compareMonthA'),b=el('compareMonthB');if(!a||!b)return;const v=a.value;a.value=b.value;b.value=v;renderMonthlyComparisonV53()}
async function renderMonthlyComparisonV53(){const target=el('monthlyCompareResult');const aKey=el('compareMonthA')?.value,bKey=el('compareMonthB')?.value;if(!target||!aKey||!bKey)return;target.innerHTML='<div class="empty">Armando comparación…</div>';const a=monthlySnapshotV53(aKey),b=monthlySnapshotV53(bKey),ma=a.measurement||{},mb=b.measurement||{};const summary=monthlyAutomaticSummaryV53(a,b);const poseLabel={front:'Frente',side:'Perfil',back:'Espalda'};const photoRows=[];for(const pose of ['front','side','back']){const [ca,cb]=await Promise.all([comparisonPhotoCellV53(photoForPoseV53(a,pose),aKey),comparisonPhotoCellV53(photoForPoseV53(b,pose),bKey)]);photoRows.push(`<div class="compare-pose"><div class="compare-pose-title">${poseLabel[pose]}</div><div class="compare-pair">${ca}${cb}</div></div>`)}target.innerHTML=`<div class="compare-head"><div class="compare-month"><div class="muted tiny">INICIAL</div><strong>${esc(monthTitleV53(aKey))}</strong><div class="pill-row" style="margin-top:8px"><span class="compare-chip">${a.checks.length} check-in${a.checks.length===1?'':'s'}</span><span class="compare-chip">${a.training.sessions} entrenamientos</span></div></div><div class="compare-month"><div class="muted tiny">FINAL</div><strong>${esc(monthTitleV53(bKey))}</strong><div class="pill-row" style="margin-top:8px"><span class="compare-chip">${b.checks.length} check-in${b.checks.length===1?'':'s'}</span><span class="compare-chip">${b.training.sessions} entrenamientos</span></div></div></div><div class="compare-summary"><div class="compare-stat"><div class="muted tiny">Peso</div><div class="value">${mb.weight_kg==null?'—':numV53(mb.weight_kg)+' kg'}</div><div class="delta">${deltaV53(ma.weight_kg,mb.weight_kg,' kg',true)}</div></div><div class="compare-stat"><div class="muted tiny">Cintura</div><div class="value">${mb.waist_cm==null?'—':numV53(mb.waist_cm)+' cm'}</div><div class="delta">${deltaV53(ma.waist_cm,mb.waist_cm,' cm',true)}</div></div><div class="compare-stat"><div class="muted tiny">Adherencia media</div><div class="value">${b.wellness.adherence==null?'—':numV53(b.wellness.adherence)+'/10'}</div><div class="delta">${deltaV53(a.wellness.adherence,b.wellness.adherence,'',false)}</div></div><div class="compare-stat"><div class="muted tiny">Entrenamientos</div><div class="value">${b.training.sessions}</div><div class="delta">${deltaV53(a.training.sessions,b.training.sessions,'',false)}</div></div></div>${summary?`<div class="compare-note"><strong>Resumen del período</strong><div class="muted tiny" style="margin-top:5px">${esc(summary)}</div></div>`:''}<div class="grid two" style="margin-top:12px"><div><table class="compare-table"><thead><tr><th>Medida</th><th>${esc(monthTitleV53(aKey))}</th><th>${esc(monthTitleV53(bKey))}</th><th>Cambio</th></tr></thead><tbody>${metricRowV53('Peso',ma.weight_kg,mb.weight_kg,'kg',true)}${metricRowV53('Cintura',ma.waist_cm,mb.waist_cm,'cm',true)}${metricRowV53('Abdomen',ma.abdomen_cm,mb.abdomen_cm,'cm',true)}${metricRowV53('Cadera',ma.hip_cm,mb.hip_cm,'cm',true)}${metricRowV53('Pecho',ma.chest_cm,mb.chest_cm,'cm',false)}</tbody></table></div><div><table class="compare-table"><thead><tr><th>Promedio</th><th>${esc(monthTitleV53(aKey))}</th><th>${esc(monthTitleV53(bKey))}</th><th>Cambio</th></tr></thead><tbody>${metricRowV53('Sueño',a.wellness.sleep,b.wellness.sleep,'',false)}${metricRowV53('Estrés',a.wellness.stress,b.wellness.stress,'',true)}${metricRowV53('Energía',a.wellness.energy,b.wellness.energy,'',false)}${metricRowV53('Adherencia',a.wellness.adherence,b.wellness.adherence,'',false)}${metricRowV53('Recuperación',a.wellness.recovery,b.wellness.recovery,'',false)}</tbody></table></div></div><div class="section-title" style="margin-top:18px"><div><h3>Fotos lado a lado</h3><div class="muted tiny">Misma vista, dos meses distintos.</div></div></div><div class="compare-photos">${photoRows.join('')}</div>`}

// ===== TEAM FJZ V6 · PLAN NUTRICIONAL + CALCULADORA DE MACROS =====
let nutritionCache={plan:null,foods:[],logs:[],date:dateInputToday()},nutritionLoadedAthlete=null,nutritionFoodsLoaded=false;
function nutritionAthleteId(){return trackingAthleteId()}
function nutritionPlanData(){if(!nutritionCache.plan)return null;if(!nutritionCache.plan.plan||typeof nutritionCache.plan.plan!=='object')nutritionCache.plan.plan={meals:[]};if(!Array.isArray(nutritionCache.plan.plan.meals))nutritionCache.plan.plan.meals=[];return nutritionCache.plan.plan}
function nNum(v){const n=Number(v);return Number.isFinite(n)?n:0}
function nFmt(v,d=0){const n=Number(v);return Number.isFinite(n)?n.toFixed(d):'—'}
function macroCalcFrom100(food,grams){grams=Math.max(.1,nNum(grams));const f=grams/100;return{kcal:nNum(food.kcal_100g)*f,protein_g:nNum(food.protein_100g)*f,carbs_g:nNum(food.carbs_100g)*f,fat_g:nNum(food.fat_100g)*f}}
function nutritionOptionTotals(opt){return (opt.items||[]).reduce((a,x)=>({kcal:a.kcal+nNum(x.kcal),protein_g:a.protein_g+nNum(x.protein_g),carbs_g:a.carbs_g+nNum(x.carbs_g),fat_g:a.fat_g+nNum(x.fat_g)}),{kcal:0,protein_g:0,carbs_g:0,fat_g:0})}
function nutritionLogTotals(rows=nutritionCache.logs){return rows.reduce((a,x)=>({kcal:a.kcal+nNum(x.kcal),protein_g:a.protein_g+nNum(x.protein_g),carbs_g:a.carbs_g+nNum(x.carbs_g),fat_g:a.fat_g+nNum(x.fat_g)}),{kcal:0,protein_g:0,carbs_g:0,fat_g:0})}
function nutritionTargetCards(plan,totals=null){const vals=[['Calorías',plan?.target_kcal,'kcal',totals?.kcal],['Proteína',plan?.target_protein_g,'g',totals?.protein_g],['Carbohidratos',plan?.target_carbs_g,'g',totals?.carbs_g],['Grasas',plan?.target_fat_g,'g',totals?.fat_g]];return `<div class="nutrition-targets">${vals.map(([l,t,u,c])=>`<div class="macro-card"><span class="muted tiny">${l}${c!=null?' registradas':''}</span><strong>${c!=null?nFmt(c,0):(t!=null?nFmt(t,0):'—')} ${c!=null||t!=null?u:''}</strong>${c!=null&&t!=null?`<div class="muted micro">Referencia del plan: ${nFmt(t,0)} ${u}</div>`:''}</div>`).join('')}</div>`}
async function loadNutrition(force=false,date=null){if(!cloudEnabled||!supabaseClient)return nutritionCache;const athleteId=nutritionAthleteId();if(!athleteId)return nutritionCache;date=date||nutritionCache.date||dateInputToday();const needBase=force||nutritionLoadedAthlete!==athleteId;const jobs=[];if(needBase)jobs.push(supabaseClient.from('nutrition_plans').select('*').eq('athlete_id',athleteId).maybeSingle());else jobs.push(Promise.resolve({data:nutritionCache.plan,error:null}));if(force||!nutritionFoodsLoaded)jobs.push(supabaseClient.from('food_library').select('*').order('category').order('name'));else jobs.push(Promise.resolve({data:nutritionCache.foods,error:null}));jobs.push(supabaseClient.from('nutrition_logs').select('*').eq('athlete_id',athleteId).eq('logged_on',date).order('created_at',{ascending:true}));const [pl,fo,lo]=await Promise.all(jobs);if(pl.error)throw pl.error;if(fo.error)throw fo.error;if(lo.error)throw lo.error;nutritionCache={plan:pl.data||null,foods:fo.data||[],logs:lo.data||[],date};nutritionLoadedAthlete=athleteId;nutritionFoodsLoaded=true;return nutritionCache}
function nutritionCloudGuard(targetId){if(!cloudEnabled||!supabaseClient){const b=el(targetId);if(b)b.innerHTML='<div class="empty">El módulo de nutrición requiere la cuenta conectada a la nube.</div>';return false}if(!nutritionAthleteId()){const b=el(targetId);if(b)b.innerHTML='<div class="empty">Esta ficha todavía no está vinculada a un alumno.</div>';return false}return true}
function nutritionFoodLabel(f){return `${esc(f.name)} · ${nFmt(f.kcal_100g,0)} kcal · P ${nFmt(f.protein_100g,1)} · C ${nFmt(f.carbs_100g,1)} · G ${nFmt(f.fat_100g,1)} /100g`}
async function createNutritionPlan(){const athleteId=nutritionAthleteId(),row=cloudAthletes.get(student()?.id);if(!athleteId||!row){toast('Primero vinculá la ficha');return}const plan={meals:[{id:uid('meal'),name:'Desayuno',options:[]},{id:uid('meal'),name:'Almuerzo',options:[]},{id:uid('meal'),name:'Merienda',options:[]},{id:uid('meal'),name:'Cena',options:[]}]};const {data,error}=await supabaseClient.from('nutrition_plans').insert({athlete_id:athleteId,coach_id:currentUser.id,title:'Plan nutricional',notes:'',plan}).select('*').single();if(error){toast(cloudErr(error));return}nutritionCache.plan=data;renderNutritionCoachLoaded();toast('Plan creado')}
function renderNutritionCoach(){const b=el('coachStudentBody');if(!b)return;if(!nutritionCloudGuard('coachStudentBody'))return;b.innerHTML='<div class="empty">Cargando nutrición…</div>';loadNutrition(true).then(renderNutritionCoachLoaded).catch(e=>{b.innerHTML=`<div class="empty">${esc(cloudErr(e))}</div>`})}
function renderNutritionCoachLoaded(){const b=el('coachStudentBody');if(!b)return;const p=nutritionCache.plan;if(!p){b.innerHTML=`<div class="card"><div class="section-title"><div><h3>Plan nutricional</h3><div class="muted tiny">Creá el plan del alumno y después agregá comidas y hasta 4 opciones por comida.</div></div><span class="badge blue">V6</span></div><div class="empty">Este alumno todavía no tiene un plan cargado.</div><button class="btn primary" style="width:100%;margin-top:12px" onclick="createNutritionPlan()">Crear plan nutricional</button></div>`;return}const pd=nutritionPlanData(),tot=nutritionLogTotals();b.innerHTML=`<div class="card"><div class="section-title"><div><h3>Plan nutricional</h3><div class="muted tiny">Opciones por comida + referencias de macros. Los valores son orientativos y pueden variar según marca y preparación.</div></div><span class="badge blue">Revisión ${p.revision||1}</span></div><div class="form-grid"><label class="tiny muted span2">Nombre del plan<input id="nutTitle" class="input" value="${esc(p.title||'Plan nutricional')}"></label><label class="tiny muted">Calorías ref.<input id="nutKcal" class="input" type="number" min="0" step="1" value="${p.target_kcal??''}" placeholder="Opcional"></label><label class="tiny muted">Proteína g<input id="nutProtein" class="input" type="number" min="0" step="1" value="${p.target_protein_g??''}" placeholder="Opcional"></label><label class="tiny muted">Carbos g<input id="nutCarbs" class="input" type="number" min="0" step="1" value="${p.target_carbs_g??''}" placeholder="Opcional"></label><label class="tiny muted">Grasas g<input id="nutFat" class="input" type="number" min="0" step="1" value="${p.target_fat_g??''}" placeholder="Opcional"></label><label class="tiny muted span2">Indicaciones<textarea id="nutNotes" class="input" rows="3">${esc(p.notes||'')}</textarea></label></div><div class="nutrition-note" style="margin-top:12px"><strong>Referencia, no cálculo automático</strong><div class="muted tiny" style="margin-top:4px">La app no genera déficits ni objetivos por sí sola. Vos definís la referencia del plan y el alumno usa el registro para saber qué consumió.</div></div><div class="nutrition-builder-actions" style="margin-top:12px"><button class="btn primary" onclick="saveNutritionPlan()">Guardar plan</button><button class="btn" onclick="addNutritionMeal()">+ Comida</button></div></div><div class="nutrition-section-gap"></div><div class="meal-plan">${pd.meals.length?pd.meals.map(renderNutritionMealCoach).join(''):'<div class="empty">Agregá una comida para empezar.</div>'}</div><div class="nutrition-section-gap"></div><div class="card"><div class="section-title"><div><h3>Registro del alumno · ${esc(nutritionCache.date)}</h3><div class="muted tiny">Vista rápida de lo que cargó con la calculadora o desde su plan.</div></div><button class="btn small" onclick="reloadCoachNutritionLog()">Actualizar</button></div>${nutritionTargetCards(p,tot)}<div style="height:10px"></div>${renderNutritionLogs(false)}</div>`}
function renderNutritionMealCoach(meal){return `<div class="meal-block"><div class="meal-head"><div><strong>${esc(meal.name||'Comida')}</strong><div class="muted tiny">${(meal.options||[]).length}/4 opciones</div></div><div class="nutrition-builder-actions"><button class="btn small" onclick="renameNutritionMeal('${meal.id}')">Renombrar</button><button class="btn small" onclick="addNutritionOption('${meal.id}')">+ Opción</button><button class="btn ghost small" onclick="deleteNutritionMeal('${meal.id}')">Eliminar</button></div></div><div class="option-grid">${(meal.options||[]).length?meal.options.map(o=>renderNutritionOptionCoach(meal,o)).join(''):'<div class="empty">Sin opciones todavía.</div>'}</div></div>`}
function renderNutritionOptionCoach(meal,opt){const t=nutritionOptionTotals(opt);return `<div class="option-card"><div class="option-head"><div><strong>${esc(opt.name||'Opción')}</strong><div class="macro-row" style="margin-top:5px"><span class="macro-chip">${nFmt(t.kcal,0)} kcal</span><span class="macro-chip">P ${nFmt(t.protein_g,1)} g</span><span class="macro-chip">C ${nFmt(t.carbs_g,1)} g</span><span class="macro-chip">G ${nFmt(t.fat_g,1)} g</span></div></div><div class="nutrition-builder-actions"><button class="btn small" onclick="openNutritionFoodPicker('${meal.id}','${opt.id}')">+ Alimento</button><button class="btn ghost small" onclick="deleteNutritionOption('${meal.id}','${opt.id}')">Eliminar</button></div></div><div>${(opt.items||[]).length?opt.items.map(i=>`<div class="food-item"><div><strong>${esc(i.name)}</strong><div class="muted micro">${nFmt(i.kcal,0)} kcal · P ${nFmt(i.protein_g,1)} · C ${nFmt(i.carbs_g,1)} · G ${nFmt(i.fat_g,1)}</div></div><input class="input" type="number" min="1" step="1" value="${nFmt(i.grams,0)}" onchange="updateNutritionItemGrams('${meal.id}','${opt.id}','${i.id}',this.value)"><button class="btn ghost small" onclick="removeNutritionItem('${meal.id}','${opt.id}','${i.id}')">✕</button></div>`).join(''):'<div class="muted tiny" style="margin-top:10px">Agregá alimentos a esta opción.</div>'}</div></div>`}
async function saveNutritionPlan(){const p=nutritionCache.plan;if(!p)return;const val=id=>{const v=el(id)?.value;return v===''||v==null?null:+v};const payload={title:el('nutTitle')?.value.trim()||'Plan nutricional',notes:el('nutNotes')?.value.trim()||'',target_kcal:val('nutKcal'),target_protein_g:val('nutProtein'),target_carbs_g:val('nutCarbs'),target_fat_g:val('nutFat'),plan:nutritionPlanData(),revision:(p.revision||1)+1,published_at:new Date().toISOString()};const {data,error}=await supabaseClient.from('nutrition_plans').update(payload).eq('id',p.id).select('*').single();if(error){toast(cloudErr(error));return}nutritionCache.plan=data;renderNutritionCoachLoaded();toast('Plan nutricional guardado')}
function findNutritionMeal(id){return nutritionPlanData()?.meals.find(x=>x.id===id)}
function findNutritionOption(mealId,optId){return findNutritionMeal(mealId)?.options?.find(x=>x.id===optId)}
function addNutritionMeal(){showModal(`<div class="modal-head"><h3>Nueva comida</h3><button class="btn small" onclick="closeModal()">✕</button></div><label class="tiny muted">Nombre<input id="newMealName" class="input" placeholder="Ej: Pre entreno"></label><button class="btn primary" style="width:100%;margin-top:12px" onclick="confirmNutritionMeal()">Agregar</button>`)}
function confirmNutritionMeal(){const n=el('newMealName')?.value.trim();if(!n)return;nutritionPlanData().meals.push({id:uid('meal'),name:n,options:[]});closeModal();renderNutritionCoachLoaded()}
function renameNutritionMeal(id){const m=findNutritionMeal(id);if(!m)return;showModal(`<div class="modal-head"><h3>Renombrar comida</h3><button class="btn small" onclick="closeModal()">✕</button></div><input id="renameMealName" class="input" value="${esc(m.name)}"><button class="btn primary" style="width:100%;margin-top:12px" onclick="confirmRenameNutritionMeal('${id}')">Guardar</button>`)}
function confirmRenameNutritionMeal(id){const m=findNutritionMeal(id),n=el('renameMealName')?.value.trim();if(!m||!n)return;m.name=n;closeModal();renderNutritionCoachLoaded()}
function deleteNutritionMeal(id){const pd=nutritionPlanData();pd.meals=pd.meals.filter(x=>x.id!==id);renderNutritionCoachLoaded()}
function addNutritionOption(mealId){const m=findNutritionMeal(mealId);if(!m)return;m.options=m.options||[];if(m.options.length>=4){toast('Máximo 4 opciones por comida');return}m.options.push({id:uid('opt'),name:`Opción ${m.options.length+1}`,items:[]});renderNutritionCoachLoaded()}
function deleteNutritionOption(mealId,optId){const m=findNutritionMeal(mealId);if(!m)return;m.options=(m.options||[]).filter(x=>x.id!==optId);renderNutritionCoachLoaded()}
function openNutritionFoodPicker(mealId,optId,q=''){const foods=nutritionCache.foods.filter(f=>!q||f.name.toLowerCase().includes(q.toLowerCase())||f.category.toLowerCase().includes(q.toLowerCase())).slice(0,80);showModal(`<div class="modal-head"><div><h3>Agregar alimento</h3><div class="muted tiny">Valores aproximados por 100 g.</div></div><button class="btn small" onclick="closeModal()">✕</button></div><input id="foodPickerSearch" class="input" placeholder="Buscar alimento..." value="${esc(q)}" oninput="filterNutritionFoodPicker('${mealId}','${optId}',this.value)"><div id="foodPickerList" class="food-picker" style="margin-top:10px">${foods.map(f=>`<button class="food-choice" onclick="chooseNutritionFood('${mealId}','${optId}','${f.id}')"><strong>${esc(f.name)}</strong><small>${esc(f.category)} · ${nFmt(f.kcal_100g,0)} kcal · P ${nFmt(f.protein_100g,1)} · C ${nFmt(f.carbs_100g,1)} · G ${nFmt(f.fat_100g,1)}</small></button>`).join('')}</div><button class="btn" style="width:100%;margin-top:10px" onclick="openCustomPlanFood('${mealId}','${optId}')">+ Alimento personalizado</button>`)}
function filterNutritionFoodPicker(mealId,optId,q){const holder=el('foodPickerList');if(!holder)return;const foods=nutritionCache.foods.filter(f=>!q||f.name.toLowerCase().includes(q.toLowerCase())||f.category.toLowerCase().includes(q.toLowerCase())).slice(0,80);holder.innerHTML=foods.map(f=>`<button class="food-choice" onclick="chooseNutritionFood('${mealId}','${optId}','${f.id}')"><strong>${esc(f.name)}</strong><small>${esc(f.category)} · ${nFmt(f.kcal_100g,0)} kcal · P ${nFmt(f.protein_100g,1)} · C ${nFmt(f.carbs_100g,1)} · G ${nFmt(f.fat_100g,1)}</small></button>`).join('')||'<div class="empty">Sin resultados.</div>'}

let nutritionRealtimeChannel=null;
function nutritionPluralUnit(unit,qty){unit=(unit||'unidad').trim();qty=Number(qty);if(Math.abs(qty-1)<0.001)return unit;const map={huevo:'huevos',clara:'claras',banana:'bananas',manzana:'manzanas',tostada:'tostadas',cucharada:'cucharadas',unidad:'unidades',vaso:'vasos',porción:'porciones',porcion:'porciones'};return map[unit.toLowerCase()]||(/s$/i.test(unit)?unit:unit+'s')}
function nutritionAmountText(item){if((item?.measure_type||'grams')==='units'){const q=nNum(item.quantity||1),u=nutritionPluralUnit(item.unit_name||'unidad',q);return `${nFmt(q,Number.isInteger(q)?0:1)} ${esc(u)}`}return `${nFmt(item?.grams,0)} g`}
function nutritionLogAmountText(row){if((row?.measure_type||'grams')==='units'&&row?.quantity!=null){const q=nNum(row.quantity),u=nutritionPluralUnit(row.unit_name||'unidad',q);return `${nFmt(q,Number.isInteger(q)?0:1)} ${esc(u)}`}return `${nFmt(row?.grams,0)} g`}
function nutritionFoodUnitReady(food){return !!(food?.unit_name&&nNum(food?.grams_per_unit)>0)}
async function ensureNutritionAthleteId(){if(currentProfile?.role!=='student')return nutritionAthleteId();if(linkedAthleteId)return linkedAthleteId;if(!supabaseClient||!currentUser)return null;const {data,error}=await supabaseClient.from('athletes').select('id,coach_id,user_id,client_id,name,goal,invite_code,spotify_url,spotify_title').eq('user_id',currentUser.id).maybeSingle();if(error)throw error;if(!data)return null;linkedAthleteId=data.id;cloudAthletes=new Map([[data.client_id,data]]);return data.id}
async function loadNutrition(force=false,date=null){if(!cloudEnabled||!supabaseClient)return nutritionCache;const athleteId=await ensureNutritionAthleteId();if(!athleteId)return nutritionCache;date=date||nutritionCache.date||dateInputToday();const needBase=force||nutritionLoadedAthlete!==athleteId;const jobs=[];if(needBase)jobs.push(supabaseClient.from('nutrition_plans').select('*').eq('athlete_id',athleteId).maybeSingle());else jobs.push(Promise.resolve({data:nutritionCache.plan,error:null}));if(force||!nutritionFoodsLoaded)jobs.push(supabaseClient.from('food_library').select('*').order('category').order('name'));else jobs.push(Promise.resolve({data:nutritionCache.foods,error:null}));jobs.push(supabaseClient.from('nutrition_logs').select('*').eq('athlete_id',athleteId).eq('logged_on',date).order('created_at',{ascending:true}));const [pl,fo,lo]=await Promise.all(jobs);if(pl.error)throw pl.error;if(fo.error)throw fo.error;if(lo.error)throw lo.error;nutritionCache={plan:pl.data||null,foods:fo.data||[],logs:lo.data||[],date};nutritionLoadedAthlete=athleteId;nutritionFoodsLoaded=true;return nutritionCache}

let nutritionV63={weekLogs:[],templates:[],revisions:[]};

function v63DeepClone(v){return JSON.parse(JSON.stringify(v??null))}
function v63ParseDate(s){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');if(!m)return new Date();return new Date(Date.UTC(+m[1],+m[2]-1,+m[3],12))}
function v63Iso(d){return d.toISOString().slice(0,10)}
function nutritionWeekBoundsV63(dateStr){
  const d=v63ParseDate(dateStr||dateInputToday()), day=(d.getUTCDay()+6)%7;
  const start=new Date(d);start.setUTCDate(start.getUTCDate()-day);
  const end=new Date(start);end.setUTCDate(end.getUTCDate()+6);
  return{start:v63Iso(start),end:v63Iso(end),focus:v63Iso(d)}
}
function v63MaxDate(a,b){return !a?b:!b?a:(a>b?a:b)}
function nutritionAdherenceV63(){
  const p=nutritionCache.plan,pd=nutritionPlanData();
  const mealNames=(pd?.meals||[]).filter(m=>(m.options||[]).length>0).map(m=>m.name);
  const planned=mealNames.length;
  const bounds=nutritionWeekBoundsV63(nutritionCache.date||dateInputToday());
  let start=bounds.start;
  const published=(p?.published_at||p?.created_at||'').slice(0,10);
  if(published)start=v63MaxDate(start,published);
  const focus=bounds.focus;
  const elapsed=Math.max(1,Math.floor((v63ParseDate(focus)-v63ParseDate(start))/86400000)+1);
  const valid=new Set(mealNames);
  const week=(nutritionV63.weekLogs||[]).filter(x=>x.source==='plan'&&x.logged_on>=start&&x.logged_on<=focus&&valid.has(x.meal_label));
  const keys=new Set(week.map(x=>`${x.logged_on}|${x.meal_label}`));
  const todayKeys=new Set(week.filter(x=>x.logged_on===focus).map(x=>x.meal_label));
  const expected=planned*elapsed;
  const pct=expected?Math.min(100,Math.round(keys.size/expected*100)):0;
  return{planned,elapsed,expected,completed:keys.size,todayCompleted:todayKeys.size,pct,start,focus}
}
function nutritionAdherenceCardV63(studentView=false){
  const a=nutritionAdherenceV63();
  if(!nutritionCache.plan)return '';
  return `<div class="card v63-adherence-card">
    <div class="section-title"><div><h3>Seguimiento del plan</h3><div class="muted tiny">${studentView?'Registro de las opciones del plan que marcaste.':'Adherencia basada en las comidas del plan registradas por el alumno.'}</div></div><span class="badge blue">Semana actual</span></div>
    <div class="v63-adherence">
      <div class="macro-card"><span class="muted tiny">Hoy</span><strong>${a.todayCompleted}/${a.planned||0}</strong><div class="muted micro">comidas del plan registradas</div></div>
      <div class="macro-card"><span class="muted tiny">Semana</span><strong>${a.completed}/${a.expected||0}</strong><div class="muted micro">registros esperados hasta hoy</div></div>
      <div class="macro-card"><span class="muted tiny">Registro semanal</span><strong>${a.expected?a.pct+'%':'—'}</strong><div class="v63-progress"><span style="width:${a.pct}%"></span></div></div>
    </div>
  </div>`;
}

const _loadNutritionV62=loadNutrition;
loadNutrition=async function(force=false,date=null){
  const base=await _loadNutritionV62(force,date);
  if(!cloudEnabled||!supabaseClient)return base;
  const athleteId=await ensureNutritionAthleteId();
  if(!athleteId)return base;
  const bounds=nutritionWeekBoundsV63(nutritionCache.date||date||dateInputToday());
  const jobs=[
    supabaseClient.from('nutrition_logs').select('*').eq('athlete_id',athleteId).gte('logged_on',bounds.start).lte('logged_on',bounds.end).order('logged_on',{ascending:true}).order('created_at',{ascending:true})
  ];
  if(currentProfile?.role==='coach'){
    jobs.push(supabaseClient.from('nutrition_templates').select('*').eq('coach_id',currentUser.id).order('updated_at',{ascending:false}));
    if(nutritionCache.plan?.id)jobs.push(supabaseClient.from('nutrition_plan_revisions').select('*').eq('plan_id',nutritionCache.plan.id).order('revision',{ascending:false}).limit(20));
    else jobs.push(Promise.resolve({data:[],error:null}));
  }else{
    jobs.push(Promise.resolve({data:[],error:null}));
    jobs.push(Promise.resolve({data:[],error:null}));
  }
  const [wk,tp,rv]=await Promise.all(jobs);
  if(wk.error)throw wk.error;if(tp.error)throw tp.error;if(rv.error)throw rv.error;
  nutritionV63={weekLogs:wk.data||[],templates:tp.data||[],revisions:rv.data||[]};
  nutritionCache.weekLogs=nutritionV63.weekLogs;
  nutritionCache.templates=nutritionV63.templates;
  nutritionCache.revisions=nutritionV63.revisions;
  return nutritionCache;
}

saveNutritionPlan=async function(){
  const p=nutritionCache.plan;if(!p)return;
  const val=id=>{const v=el(id)?.value;return v===''||v==null?null:+v};
  const enabled=el('nutLoggingEnabled')?!!el('nutLoggingEnabled').checked:nutritionLoggingEnabledV64();
  const payload={
    title:el('nutTitle')?.value.trim()||'Plan nutricional',
    notes:el('nutNotes')?.value.trim()||'',
    target_kcal:val('nutKcal'),
    target_protein_g:val('nutProtein'),
    target_carbs_g:val('nutCarbs'),
    target_fat_g:val('nutFat'),
    plan:nutritionPlanData(),
    student_logging_enabled:enabled,
    revision:(p.revision||1)+1,
    published_at:new Date().toISOString()
  };
  const {data,error}=await supabaseClient.from('nutrition_plans').update(payload).eq('id',p.id).select('*').single();

}

// El inicio de sesión no debe volver a la pantalla de login por un fallo secundario
// de Realtime o de un bloque visual opcional.
async function handleSessionV641(session){
  if(!session?.user){showAuthGate();return}
  currentUser=session.user;
  setCloudStatus('syncing','Conectando');
  try{
    currentProfile=await fetchProfile();
    if(currentProfile.role==='coach'){
      mode='coach';
      const result=await loadCoachCloud();
      hideGate();
      try{render()}catch(uiErr){
        console.error('TEAM FJZ render error',uiErr);
        setCloudStatus('error','Vista con error');
        toast('La sesión inició, pero hubo un error al dibujar una sección.');
      }
      if(result==='empty')showCloudBootstrap();
    }else{
      mode='student';
      const linked=await loadStudentCloud();
      if(!linked){showClaimGate();return}
      hideGate();
      try{render()}catch(uiErr){
        console.error('TEAM FJZ render error',uiErr);
        setCloudStatus('error','Vista con error');
        toast('La sesión inició, pero hubo un error al dibujar una sección.');
      }
    }
  }catch(coreErr){
    console.error('TEAM FJZ session load error',coreErr);
    setCloudStatus('error','Error');
    showAuthGate('login',cloudErr(coreErr));
    return
  }

  // Realtime es complementario: si falla, la cuenta sigue iniciada.
  try{
    setupRealtime();
  }catch(rtErr){
    console.error('TEAM FJZ realtime error',rtErr);
  }
  setCloudStatus('online','En nube');
}
handleSession=handleSessionV641;

const _setupRealtimeV641=setupRealtime;
setupRealtime=function(){
  // Evita canales duplicados si Auth dispara más de un evento de sesión.
  try{
    if(window.__fjzV63NutritionChannel && supabaseClient){
      supabaseClient.removeChannel(window.__fjzV63NutritionChannel);
      window.__fjzV63NutritionChannel=null;
    }
  }catch(e){console.warn('No se pudo limpiar canal anterior',e)}
  try{
    return _setupRealtimeV641();
  }catch(e){
    console.error('Realtime no disponible temporalmente',e);
    return null
  }
};

const _loginCloudV641=loginCloud;
loginCloud=async function(){
  const email=el('authEmail')?.value.trim()||'';
  const password=el('authPass')?.value||'';
  if(!email||!password){setAuthMsg('Completá email y contraseña.');return}
  const btn=[...document.querySelectorAll('#authCard .btn.primary')].find(b=>b.textContent.includes('Ingresar'));
  if(btn)btn.disabled=true;
  setAuthMsg('Ingresando...',true);
  try{
    const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
    if(error){setAuthMsg(cloudErr(error));return}
    await handleSessionV641(data.session);
  }catch(e){
    setAuthMsg(cloudErr(e));
  }finally{
    if(btn)btn.disabled=false
  }
};

let nutritionHabitLogsV66=[];

const _nutritionPlanDataV66=nutritionPlanData;
nutritionPlanData=function(){
  const pd=_nutritionPlanDataV66();
  if(!pd)return pd;
  if(!Array.isArray(pd.habits)){
    pd.habits=nutritionHabitPresetsV66.map((h,i)=>({...h,enabled:i<6,custom:false}));
  }else{
    nutritionHabitPresetsV66.forEach((h,i)=>{
      if(!pd.habits.some(x=>x.id===h.id))pd.habits.push({...h,enabled:i<6,custom:false});
    });
  }
  return pd
}
function nutritionHabitsV66(){
  return (nutritionPlanData()?.habits||[])
}
function activeNutritionHabitsV66(){
  return nutritionHabitsV66().filter(h=>h.enabled!==false)
}
function habitDoneV66(id){
  return !!nutritionHabitLogsV66.find(x=>x.habit_id===id&&x.completed)
}
function habitProgressV66(){
  const active=activeNutritionHabitsV66();
  const done=active.filter(h=>habitDoneV66(h.id)).length;
  return {active:active.length,done,pct:active.length?Math.round(done/active.length*100):0}
}

const _loadNutritionV66=loadNutrition;
loadNutrition=async function(force=false,date=null){
  const base=await _loadNutritionV66(force,date);
  if(!cloudEnabled||!supabaseClient)return base;
  const athleteId=await ensureNutritionAthleteId();

function spotifyNormalizeUrlV67(raw){
  let u=String(raw||'').trim();
  if(!u)return '';
  if(/^spotify:(playlist|track|album|artist|show|episode):/i.test(u)){
    const parts=u.split(':');
    return `https://open.spotify.com/${parts[1].toLowerCase()}/${parts[2]}`;
  }
  if(!/^https?:\/\//i.test(u))u='https://'+u;
  try{
    const x=new URL(u);
    if(!/(\.|^)spotify\.com$/i.test(x.hostname))return '';
    return x.href;
  }catch(e){return ''}
}
function spotifyEmbedUrlV67(raw){
  const url=spotifyNormalizeUrlV67(raw);
  if(!url)return '';
  try{
    const u=new URL(url);
    if(u.hostname==='spotify.link')return '';
    const m=u.pathname.match(/^\/(?:intl-[a-z]{2}\/)?(playlist|track|album|artist|show|episode)\/([A-Za-z0-9]+)/i);
    if(!m)return '';
    return `https://open.spotify.com/embed/${m[1].toLowerCase()}/${m[2]}?utm_source=generator&theme=0`;
  }catch(e){return ''}
}
function spotifyOpenUrlV67(raw){

// ---------- Perfil ----------
const avatarPathCacheV70=new Map();
const avatarSignedCacheV70=new Map();

fetchProfile=async function(){
  let {data,error}=await supabaseClient.from('profiles').select('id,full_name,role,avatar_url').eq('id',currentUser.id).maybeSingle();
  if(error)throw error;
  if(!data)data={id:currentUser.id,full_name:currentUser.user_metadata?.full_name||'',role:currentUser.user_metadata?.role==='coach'?'coach':'student',avatar_url:null};
  return data
};

async function signedAvatarV70(path){
  if(!path)return '';
  const hit=avatarSignedCacheV70.get(path);
  if(hit&&hit.expires>Date.now())return hit.url;
  const {data,error}=await supabaseClient.storage.from('profile-photos').createSignedUrl(path,3600);
  if(error)return '';
  const url=data?.signedUrl||'';
  avatarSignedCacheV70.set(path,{url,expires:Date.now()+50*60*1000});
  return url
}
async function profilePathV70(userId){
  if(!userId)return '';
  if(userId===currentProfile?.id&&currentProfile?.avatar_url)return currentProfile.avatar_url;
  if(avatarPathCacheV70.has(userId))return avatarPathCacheV70.get(userId)||'';
  const {data,error}=await supabaseClient.from('profiles').select('id,avatar_url').eq('id',userId).maybeSingle();
  if(error)return '';
  avatarPathCacheV70.set(userId,data?.avatar_url||'');
  return data?.avatar_url||''
}
async function avatarHtmlV70(userId,name,size=''){
  const path=await profilePathV70(userId);
  const url=await signedAvatarV70(path);
  return `<div class="v70-avatar ${size}">${url?`<img src="${url}" alt="${esc(name||'Perfil')}">`:esc((name||'?').slice(0,2).toUpperCase())}</div>`
}
async function uploadProfilePhotoV70(input){
  const file=input?.files?.[0];if(!file)return;
  if(file.size>5*1024*1024){toast('La foto debe pesar menos de 5 MB');input.value='';return}
  const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
  const path=`${currentUser.id}/avatar-${Date.now()}.${ext}`;
  const old=currentProfile?.avatar_url||'';
  const {error:upErr}=await supabaseClient.storage.from('profile-photos').upload(path,file,{upsert:false,contentType:file.type||'image/jpeg'});
  if(upErr){toast(cloudErr(upErr));return}
  const {data,error}=await supabaseClient.from('profiles').update({avatar_url:path}).eq('id',currentUser.id).select('id,full_name,role,avatar_url').single();
  if(error){toast(cloudErr(error));return}
  currentProfile=data;
  avatarPathCacheV70.set(currentUser.id,path);
  avatarSignedCacheV70.clear();
  if(old&&old!==path){try{await supabaseClient.storage.from('profile-photos').remove([old])}catch(e){}}
  input.value='';
  toast('Foto de perfil actualizada');
  render()
}
async function removeProfilePhotoV70(){
  const old=currentProfile?.avatar_url||'';
  const {data,error}=await supabaseClient.from('profiles').update({avatar_url:null}).eq('id',currentUser.id).select('id,full_name,role,avatar_url').single();
  if(error){toast(cloudErr(error));return}
  currentProfile=data;
  avatarPathCacheV70.set(currentUser.id,'');
  avatarSignedCacheV70.clear();
  if(old){try{await supabaseClient.storage.from('profile-photos').remove([old])}catch(e){}}
  toast('Foto eliminada');
  render()
}

      <div class="card">
        <div class="section-title"><div><h3>Recetas TEAM FJZ</h3><div class="muted tiny">Ideas dulces, saladas, desayunos y meriendas. Valores nutricionales orientativos.</div></div><span class="badge blue">${recipeCacheV70.length} recetas</span></div>

function sessionsLastDaysV71(s,days){
  const cut=Date.now()-days*86400000;
  return (s?.sessions||[]).filter(x=>{

    return Number.isFinite(d)&&d>=cut
  })
}

}

async function buildCoachHelpV71(){
  await Promise.all([loadTracking(true),loadNutrition(true)]);
  const list=[];
  const cs=trackingCache.checkins||[];
  const latest=cs[0]||null;
  const prev=cs[1]||null;
  const s=student();
  const last14=sessionsLastDaysV71(s,14);
  const last=lastSessionV71(s);

  if(!latest){
    pushHelpV71(list,'info','Primero reunir datos','Todavía no hay un check-in reciente. Antes de cambiar volumen, cargas o alimentación, conviene tener una referencia de sueño, energía, estrés, recuperación y adherencia.','Falta el check-in semanal.');
  }else{
    const recoveryFlags=[
      latest.sleep_quality<=5,
      latest.energy_level<=5,
      latest.recovery_level<=5,
      latest.stress_level>=7
    ].filter(Boolean).length;

    if(recoveryFlags>=2){
      pushHelpV71(
        list,'review','No sumaría exigencia todavía',
        'Hay varias señales de recuperación comprometida. Antes de agregar series, frecuencia o intensidad, revisaría descanso, estrés, horarios y cómo viene tolerando la rutina.',
        `Sueño ${latest.sleep_quality}/10 · Energía ${latest.energy_level}/10 · Estrés ${latest.stress_level}/10 · Recuperación ${latest.recovery_level}/10.`
      );
    }else if(latest.energy_level>=7&&latest.recovery_level>=7&&latest.stress_level<=5&&latest.adherence_level>=7){
      const up=Number(last?.summary?.up)||0;
      if(up>0){
        pushHelpV71(
          list,'good','Podés progresar donde ya cumplió el objetivo',
          'La recuperación y la adherencia acompañan. En los ejercicios que completaron el rango y RIR previstos, podés considerar una progresión pequeña de carga o repeticiones, sin cambiar todo el programa.',
          `Energía ${latest.energy_level}/10 · Recuperación ${latest.recovery_level}/10 · ${up} ejercicios progresaron en la última sesión registrada.`
        );
      }else{
        pushHelpV71(
          list,'good','Mantendría la base',
          'Los indicadores generales están bien. No hace falta modificar por modificar: mantené la estructura y buscá pequeñas mejoras de ejecución, repeticiones o carga cuando corresponda.',
          `Adherencia ${latest.adherence_level}/10 · Energía ${latest.energy_level}/10 · Recuperación ${latest.recovery_level}/10.`
        );
      }
    }

    if(latest.adherence_level<=5){
      pushHelpV71(
        list,'review','Simplificar antes de agregar o sacar cosas',
        'La adherencia está baja. Antes de tocar muchas variables, revisaría horarios, cantidad de tareas, preferencias y qué parte del plan realmente le cuesta sostener.',
        `Adherencia reportada: ${latest.adherence_level}/10.`
      );
    }

    if(latest.hunger_level>=8){
      pushHelpV71(
        list,'info','Hambre alta: revisar el contexto',
        'Conviene preguntar en qué momentos aparece, cómo distribuye las comidas y qué tan saciantes son. Evitá hacer un ajuste automático solo por un número aislado.',
        `Hambre reportada: ${latest.hunger_level}/10.`
      );
    }

    if(prev&&latest.sleep_quality<prev.sleep_quality-2){
      pushHelpV71(
        list,'info','El sueño cayó respecto al check-in anterior',
        'Revisaría si cambió el horario, el estrés o la rutina diaria antes de interpretar una sesión floja como falta de esfuerzo.',
        `Sueño anterior ${prev.sleep_quality}/10 → actual ${latest.sleep_quality}/10.`
      );
    }
  }

  if(last14.length===0){
    pushHelpV71(
      list,'review','Revisar continuidad de entrenamiento',
      'No aparecen entrenamientos recientes. Antes de sumar trabajo, buscaría entender la barrera: horarios, molestias, motivación, disponibilidad o dificultad del plan.',
      'No hay sesiones registradas en los últimos 14 días.'
    );
  }else if(last14.length>=1){
    const reviewTotal=last14.reduce((a,x)=>a+(Number(x?.summary?.review)||0),0);
    if(reviewTotal>0){
      pushHelpV71(
        list,'review','Hay ejercicios para revisar',
        'Algunas sesiones marcaron cargas o ejecuciones para revisar. Priorizá esos ejercicios antes de aumentar volumen general.',
        `${reviewTotal} señales de revisión registradas en las últimas sesiones.`
      );
    }
  }

  if(nutritionCache.plan){
    const logging=nutritionLoggingEnabledV64();
    if(logging){
      const a=nutritionAdherenceV63();
      if(a.expected>=3&&a.pct<50){
        pushHelpV71(
          list,'info','Revisar la practicidad del plan nutricional',
          'Hay pocos registros del plan. Antes de cambiar cantidades, preguntaría si las opciones son cómodas, si puede cocinar o llevarlas y qué comidas se le complican.',
          `${a.completed}/${a.expected} comidas del plan registradas esta semana.`
        );
      }
    }else{
      pushHelpV71(
        list,'info','Nutrición sin registro diario',
        'Este alumno no tiene activado el registro de comidas. Para evaluar el plan, apoyate más en el check-in, sus comentarios y la conversación directa.',
        'Registro nutricional desactivado para este alumno.'
      );
    }
  }

  if(!list.length){
    pushHelpV71(
      list,'good','Sin cambios urgentes',
      'Los datos disponibles no muestran una señal clara para modificar el plan ahora. Seguiría observando tendencia, técnica, recuperación y adherencia antes de hacer un ajuste.',
      'No se detectaron banderas principales con los datos actuales.'
    );
  }

  return list.slice(0,5)
}

// ---------- Progreso global ----------
function progressSessionsInDaysV72(s,days){
  const cut=Date.now()-days*86400000;
  return (s.sessions||[]).filter(x=>new Date(x.date||0).getTime()>=cut)
}
function progressSummaryV72(s){
  const ss30=progressSessionsInDaysV72(s,30);
  const sums=ss30.reduce((a,x)=>{
    a.sets+=Number(x.summary?.totalSets)||0;
    a.up+=Number(x.summary?.up)||0;
    a.hold+=Number(x.summary?.hold)||0;
    a.review+=Number(x.summary?.review)||0;
    return a
  },{sets:0,up:0,hold:0,review:0});
  const total=sums.up+sums.hold+sums.review;
  return {sessions:ss30.length,...sums,total,progressPct:total?Math.round(sums.up/total*100):null}
}
function progressWeeksV72(s,count=6){
  const now=new Date();
  const start=new Date(now);
  const day=(start.getDay()+6)%7;
  start.setHours(0,0,0,0);
  start.setDate(start.getDate()-day-(count-1)*7);
  const weeks=Array.from({length:count},(_,i)=>{
    const a=new Date(start);a.setDate(a.getDate()+i*7);
    const b=new Date(a);b.setDate(b.getDate()+7);
    return {start:a,end:b,sessions:0,sets:0}
  });
  (s.sessions||[]).forEach(ss=>{
    const d=new Date(ss.date||0);
    const w=weeks.find(x=>d>=x.start&&d<x.end);
    if(w){w.sessions++;w.sets+=Number(ss.summary?.totalSets)||0}
  });
  return weeks
}
function renderWeeklyBarsV72(s){
