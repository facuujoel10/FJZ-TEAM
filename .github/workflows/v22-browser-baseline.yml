name: V22 browser baseline

on:
  push:
    branches:
      - dev/team-fjz-v22

permissions:
  contents: read

concurrency:
  group: team-fjz-v22-browser-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-e2e:
    if: github.ref == 'refs/heads/dev/team-fjz-v22'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TEAM_FJZ_ENV: development
      SUPABASE_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"

    steps:
      - name: Checkout exact V22 commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Assert isolated branch and unchanged production baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/dev/team-fjz-v22"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          main_sha="$(git ls-remote https://github.com/facuujoel10/FJZ-TEAM.git refs/heads/main | cut -f1)"
          test "$main_sha" = "3ffcf3efb1889dc3f915d063ffdf67d6c2ae5807"
          python scripts/dev_guard.py
          python scripts/dev_negative_guard.py
          echo "V22 isolation baseline: OK"

      - name: Verify Docker and pinned Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          docker info >/dev/null
          npx --yes supabase@3.0.0 --version >/dev/null
          echo "Docker + Supabase CLI: OK"

      - name: Install pinned Playwright test runner
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts @playwright/test@1.65.0
          npx playwright install --with-deps chromium

      - name: V22 1A/1B/1C/2A/2B module unit + contract tests
        run: node --test tests/unit/v22-date.test.js tests/unit/v22-contracts.test.js tests/unit/v22-agenda-repository.test.js tests/unit/v22-comment-repository.test.js tests/unit/v22-premium-workout.test.js tests/unit/v22-session-history.test.js tests/unit/v22-save-sync.test.js tests/unit/v22-intelligent-training.test.js tests/unit/v22-coach-command-center.test.js

      - name: Create local stack and build development app
        run: |
          python scripts/dev_reset.py
          python scripts/dev_build.py
          python scripts/dev_guard.py --artifact

      - name: V22 2B-V architecture inventory guard
        run: python scripts/v22_architecture_inventory.py --check

      - name: Audit generated JavaScript syntax
        id: syntax
        run: node scripts/dev_js_syntax_audit.js

      - name: Start local app server
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8000 -d public > /tmp/team-fjz-v22-http.log 2>&1 &
          echo $! > /tmp/team-fjz-v22-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then
              echo "Local TEAM FJZ server: OK"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/team-fjz-v22-http.log
          exit 1

      - name: Browser baseline — mobile 390x844
        id: mobile
        continue-on-error: true
        run: npx playwright test --project=mobile-390

      - name: Premium responsive — mobile 360x800
        run: npx playwright test --project=mobile-360 --grep "2A Premium responsive|2B History responsive|2B-V visual system|2B-V historial|2B-V comentarios|2B-V.1 visual polish|2B-V2 UX|2C |V22 3A"

      - name: Premium responsive — mobile 430x932
        run: npx playwright test --project=mobile-430 --grep "2A Premium responsive|2B History responsive|2B-V visual system|2B-V historial|2B-V2 UX|2C |V22 3A"

      - name: Reset local data before desktop
        if: always() && steps.mobile.outcome != 'skipped'
        run: python scripts/dev_reset.py

      - name: Browser baseline — desktop 1440x900
        id: desktop
        if: always() && steps.mobile.outcome != 'skipped'
        continue-on-error: true
        run: npx playwright test --project=desktop-1440

      - name: Checkout V21.41 visual reference
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 3ffcf3efb1889dc3f915d063ffdf67d6c2ae5807
          path: visual_refs/v2141
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout certified V22 2B-V.1 visual reference
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 6a7eb038d2920f384bb0fd73ccaaca3d9febd31c
          path: visual_refs/v22-2bv1
          persist-credentials: false
          fetch-depth: 1

      - name: Build isolated V21.41 and V22 2B-V.1 references against local Supabase
        run: |
          python scripts/dev_build_visual_reference.py visual_refs/v2141
          python scripts/dev_build_visual_reference.py visual_refs/v22-2bv1

      - name: Start isolated visual reference servers
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8001 -d visual_refs/v2141/public > /tmp/fjz-v2141-http.log 2>&1 &
          python -m http.server 8002 -d visual_refs/v22-2bv1/public > /tmp/fjz-v22-2bv1-http.log 2>&1 &
          for port in 8001 8002; do
            for i in {1..20}; do
              curl -fsS "http://127.0.0.1:$port/" >/dev/null && break
              sleep 1
            done
            curl -fsS "http://127.0.0.1:$port/" >/dev/null
          done

      - name: Capture V21.41 product experience reference
        run: |
          python scripts/dev_reset.py
          npx playwright test --project=mobile-390 --grep "2B exacto"
          node scripts/capture_product_experience_v2.js v2141 http://127.0.0.1:8001 artifacts/2bv2-comparison

      - name: Capture certified V22 2B-V.1 with same fixture
        run: |
          python scripts/dev_reset.py
          npx playwright test --project=mobile-390 --grep "2B exacto"
          node scripts/capture_product_experience_v2.js v22-2bv1 http://127.0.0.1:8002 artifacts/2bv2-comparison

      - name: Capture V22 2B-V2 with same fixture
        run: |
          python scripts/dev_reset.py
          npx playwright test --project=mobile-390 --grep "2B exacto"
          node scripts/capture_product_experience_v2.js v22-2bv2 http://127.0.0.1:8000 artifacts/2bv2-comparison

      - name: Build V21.41 vs 2B-V.1 vs 2B-V2 visual contact sheets
        run: node scripts/build_product_experience_contact_sheets.js artifacts/2bv2-comparison

      - name: Upload Premium workout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v22-2bv2-product-experience-screens
          path: |
            artifacts/2a
            artifacts/2b
            artifacts/2bv
            artifacts/2bv-comparison
            artifacts/2bv2
            artifacts/2bv2-comparison
            artifacts/2c
            artifacts/3a
          if-no-files-found: ignore
          retention-days: 14

      - name: Final isolation and QA gate
        if: always()
        shell: bash
        env:
          MOBILE_OUTCOME: ${{ steps.mobile.outcome }}
          DESKTOP_OUTCOME: ${{ steps.desktop.outcome }}
          SYNTAX_OUTCOME: ${{ steps.syntax.outcome }}
        run: |
          set -euo pipefail
          python scripts/dev_guard.py --artifact
          python preflight.py
          echo "mobile=$MOBILE_OUTCOME"
          echo "desktop=$DESKTOP_OUTCOME"
          echo "syntax=$SYNTAX_OUTCOME"
          test "$MOBILE_OUTCOME" = "success"
          test "$DESKTOP_OUTCOME" = "success"
          test "$SYNTAX_OUTCOME" = "success"

      - name: Project-scoped local Supabase shutdown
        if: always()
        run: python scripts/dev_stop_local.py
