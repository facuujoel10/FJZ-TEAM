name: V22 local Supabase integration

on:
  push:
    branches:
      - dev/team-fjz-v22

permissions:
  contents: read

concurrency:
  group: team-fjz-v22-local-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    if: github.ref == 'refs/heads/dev/team-fjz-v22'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEAM_FJZ_ENV: development
      SUPABASE_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"

    steps:
      - name: Checkout exact V22 commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Assert branch and unchanged production baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/dev/team-fjz-v22"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          main_sha="$(git ls-remote https://github.com/facuujoel10/FJZ-TEAM.git refs/heads/main | cut -f1)"
          test "$main_sha" = "3ffcf3efb1889dc3f915d063ffdf67d6c2ae5807"
          echo "Branch and production baseline: OK"

      - name: Verify Docker and pinned Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          docker info >/dev/null
          npx --yes supabase@3.0.0 --version >/dev/null
          echo "Docker + Supabase CLI: OK"

      - name: Static development guard
        run: python scripts/dev_guard.py

      - name: V22 1A canonical module unit tests
        run: node --test tests/unit/v22-date.test.js tests/unit/v22-contracts.test.js

      - name: Negative isolation tests
        run: python scripts/dev_negative_guard.py

      - name: Start real local Supabase and run integration smoke
        run: python scripts/dev_reset.py

      - name: Build application against local Supabase
        run: python scripts/dev_build.py

      - name: V22 1A architecture inventory guard
        run: python scripts/v22_architecture_inventory.py --check

      - name: Explicit project preflight
        run: python preflight.py

      - name: Recreate database from zero and repeat integration smoke
        run: python scripts/dev_reset.py

      - name: Final generated-artifact isolation check
        run: python scripts/dev_guard.py --artifact
